<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pixelmator Web</title>
<style>
:root{--bg:#f3f3f5;--pn:#fbfbfc;--ln:#d9d9de;--tx:#1d1d1f;--mu:#74747b;--ac:#0a84ff;--cv:#dcdce1;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1b1d;--pn:#252527;--ln:#38383c;--tx:#ececef;--mu:#8d8d95;--cv:#141415}}
:root[data-theme="dark"]{--bg:#1b1b1d;--pn:#252527;--ln:#38383c;--tx:#ececef;--mu:#8d8d95;--cv:#141415}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden;user-select:none;-webkit-user-select:none}
button,select,input{font:inherit;color:inherit}
.b{background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.b:hover{border-color:var(--mu)}.b:focus-visible,#tools button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
#top{display:flex;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--ln);background:var(--pn);overflow-x:auto;flex:none}
#top .sp{flex:1}#top label{display:flex;align-items:center;gap:6px;color:var(--mu);white-space:nowrap}
#top input[type=range]{width:90px;accent-color:var(--ac)}#top input[type=color]{width:28px;height:24px;padding:0;border:1px solid var(--ln);border-radius:5px;background:none}
#main{flex:1;display:flex;min-height:0}
#tools{width:50px;overflow-y:auto;flex:none;border-right:1px solid var(--ln);background:var(--pn);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0}
#tools button{width:36px;height:36px;border:0;border-radius:8px;background:none;cursor:pointer;display:grid;place-items:center;color:var(--mu)}
#tools button:hover{background:var(--bg);color:var(--tx)}#tools button.on{background:var(--ac);color:#fff}
#stage{flex:1;position:relative;background:var(--cv);min-width:0}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:16px 22px;text-align:center;pointer-events:none}
#hint b{display:block;font-size:15px;font-weight:600;margin-bottom:2px}#hint span{color:var(--mu)}
#ti{position:absolute;display:none;background:transparent;border:1px dashed var(--ac);outline:0;padding:0 2px;min-width:80px;font-weight:600;user-select:text;-webkit-user-select:text}
#toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:6px 14px;border-radius:20px;opacity:0;transition:opacity .2s;pointer-events:none}
#right{width:264px;flex:none;border-left:1px solid var(--ln);background:var(--pn);overflow-y:auto}
.sec{padding:12px 14px;border-bottom:1px solid var(--ln)}.sec h3{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--mu)}
.row{margin-bottom:8px}.row div{display:flex;justify-content:space-between}.row span:last-child{color:var(--mu);font-variant-numeric:tabular-nums}
.row input,#lop{width:100%;accent-color:var(--ac)}.sec select{width:100%;margin-top:6px;background:var(--bg);border:1px solid var(--ln);border-radius:6px;padding:4px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#ll{list-style:none;margin:8px 0;padding:0;border:1px solid var(--ln);border-radius:8px;overflow:hidden}
#ll li{display:flex;align-items:center;gap:8px;padding:6px 8px;cursor:pointer;border-bottom:1px solid var(--ln)}#ll li:last-child{border:0}
#ll li.on{background:rgba(10,132,255,.2)}#ll canvas{width:28px;height:28px;border-radius:4px;background:var(--cv);flex:none}
#ll span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#ll .eye{border:0;background:none;cursor:pointer;color:var(--mu);padding:0 2px}
#cb{display:none;gap:6px}
@media(max-width:760px){#right{display:none}}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
:root:root:root{--bg:#2e3033;--pn:#2b2d30;--ln:#101112;--tx:#e9e9ea;--mu:#a6a8ab;--ac:#560e27;--cv:#5b5e63;--a1:rgb(154,110,125);--a2:rgb(103,38,61);--a3:rgb(65,11,29);--a4:rgb(39,6,18)}
body{font-family:"Lucida Grande","Lucida Sans Unicode","Helvetica Neue",Arial,sans-serif;font-size:12px;background:#34363a}
#top{background:linear-gradient(#f6f6f6,#d6d6d6 49%,#c6c6c6 50%,#b6b6b6);border-bottom:1px solid #3c3c3c;box-shadow:inset 0 1px 0 #fff,0 2px 6px rgba(0,0,0,.5);color:#262626;position:relative;z-index:2}
#top label{color:#333;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.b{background:linear-gradient(#fff,#e3e3e3 49%,#d3d3d3 50%,#e9e9e9);color:#222;border:1px solid #777;border-radius:4px;box-shadow:inset 0 1px 0 #fff,0 1px 0 rgba(255,255,255,.6);text-shadow:0 1px 0 rgba(255,255,255,.8);padding:3px 11px}
.b:hover{border-color:#333}.b:active{background:linear-gradient(#cfcfcf,#e2e2e2);box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
#ex{background:linear-gradient(var(--a1),var(--a2) 49%,var(--a3) 50%,var(--a2))!important;border-color:var(--a4)!important;color:#fff!important;text-shadow:0 -1px 0 rgba(0,0,0,.45)!important}
#main{background:#34363a}
#tools{margin:10px 0 10px 10px;width:52px;padding:8px 6px;border:1px solid #000;border-radius:9px;background:linear-gradient(rgba(74,77,82,.97),rgba(32,34,37,.97));box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 4px 14px rgba(0,0,0,.6);align-self:flex-start;max-height:calc(100% - 20px)}
#tools button{color:#c9cbce}#tools button:hover{background:rgba(255,255,255,.12);color:#fff}
#tools button.on{background:linear-gradient(var(--a1),var(--a3));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 1px var(--a4)}
#stage{margin:10px;border:1px solid #000;border-radius:3px;background:repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 2px,transparent 2px 4px),#5b5e63;box-shadow:inset 0 0 18px rgba(0,0,0,.65)}
#right{width:282px;padding:10px 10px 0 0;background:#34363a;border:0}
.sec{margin-bottom:10px;padding:0 12px 12px;color:#e9e9ea;border:1px solid #000;border-radius:8px;background:linear-gradient(rgba(64,67,72,.98),rgba(38,40,43,.98));box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 3px 10px rgba(0,0,0,.5)}
.sec h3{margin:0 -12px 10px;padding:6px 12px;background:linear-gradient(#5d6065,#3f4247);border-bottom:1px solid #000;border-radius:7px 7px 0 0;color:#e2e2e2;text-shadow:0 -1px 0 #000;text-align:center;font-weight:700;font-size:11px}
.sec .b{background:linear-gradient(#6c6f74,#4c4f54 49%,#3f4247 50%,#4e5257);color:#f0f0f0;border-color:#0c0c0d;text-shadow:0 -1px 0 rgba(0,0,0,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.sec select{background:linear-gradient(#5d6065,#45484d);color:#eee;border:1px solid #000;text-shadow:0 -1px 0 #000}
#ll{border-color:#000;background:#1f2123}#ll li{border-color:#000}#ll li.on{background:linear-gradient(var(--a2),var(--a3));color:#fff}
#cvc{border:1px solid #000;box-shadow:inset 0 1px 3px #000}
#hint{background:rgba(28,30,33,.92);color:#eee;border-color:#000}
#tn{font-weight:700;color:#333;text-shadow:0 1px 0 #fff;margin:0 6px;white-space:nowrap}
#top #th{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;padding:0;border:0;cursor:pointer;background:radial-gradient(circle,var(--ac) 0 24%,#fff 26% 34%,transparent 36%),conic-gradient(#ff5d52 0 12.5%,#ff9d3d 0 25%,#ffd83d 0 37.5%,#7ed957 0 50%,#3ccbd9 0 62.5%,#4290f6 0 75%,#8d5ff0 0 87.5%,#f25fab 0);box-shadow:0 0 0 1px rgba(0,0,0,.55),0 1px 2px rgba(0,0,0,.3)}
#th::-webkit-color-swatch-wrapper{padding:0}#th::-webkit-color-swatch{border:0;opacity:0}#th::-moz-color-swatch{border:0;opacity:0}
#top #th:hover{animation:bb 1s linear infinite}@keyframes bb{to{transform:rotate(1turn)}}
@media(prefers-reduced-motion:reduce){#top #th:hover{animation:none}}
#rt{display:flex;margin:0 0 10px;border:1px solid #000;border-radius:6px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.5)}
#rt button{flex:1;border:0;border-right:1px solid #000;padding:5px 0;color:#d6d6d6;cursor:pointer;background:linear-gradient(#6c6f74,#4c4f54 49%,#3f4247 50%,#4e5257);text-shadow:0 -1px 0 #000}#rt button:last-child{border:0}
#rt button.on{background:linear-gradient(var(--a3),var(--a2) 55%,var(--a1));color:#fff}
.b,#tools button,#rt button{position:relative;isolation:isolate;overflow:hidden}
.b::after,#tools button::after,#rt button::after{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.1));pointer-events:none;z-index:-1}
.b{border-radius:12px;padding:3px 13px;background:linear-gradient(#f4f4f4,#c9c9c9)}
.sec .b{background:linear-gradient(#63666c,#2f3236)}.sec .b::after,#tools button::after,#rt button::after{background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,.03))}
#ex{background:linear-gradient(var(--a2),var(--a3))!important}#ex::after{background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.12))}
#tools button{border:1px solid #0b0b0c;border-radius:10px;background:linear-gradient(#5e6166,#2b2d31);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 2px rgba(0,0,0,.6)}
#tools button:hover{background:linear-gradient(#6d7076,#393c41);color:#fff}
#tools button.on,#tools button.on:hover{background:linear-gradient(var(--a1),var(--a3));color:#fff}#tools button.on::after{background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.08))}
#rt button.on::after{background:linear-gradient(rgba(255,255,255,.45),rgba(255,255,255,.05))}
input[type=range]{-webkit-appearance:none;appearance:none;height:8px;border-radius:5px;background:linear-gradient(#17181a,#3d4044);border:1px solid #000;box-shadow:0 1px 0 rgba(255,255,255,.18)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 50% 28%,#fff,var(--a1) 42%,var(--a3));border:1px solid var(--a4);box-shadow:0 1px 2px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.8)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--a2);border:1px solid var(--a4)}
#tools{background:linear-gradient(rgba(74,77,82,.97),rgba(32,34,37,.97));box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 4px 14px rgba(0,0,0,.6)}
#tools button::after{display:none}
#tools button{border:0;border-radius:8px;background:none;box-shadow:none}
#tools button:hover{background:rgba(255,255,255,.12);color:#fff}
#tools button.on,#tools button.on:hover{background:linear-gradient(var(--a1),var(--a3));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 1px var(--a4)}#toast{background:rgba(20,20,20,.9);color:#fff}
.logo{width:100%;height:auto;flex:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.7))}@media(min-width:761px){#right{display:flex;flex-direction:column}}#right>*{flex:none}#lgw{margin-top:auto;padding:14px 4px 12px;display:flex;justify-content:center}
</style></head><body>
