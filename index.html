            'https://static.wikia.nocookie.net/marsargo/images/9/97/Tony_Katai_%282015%29_1-010.jpg/revision/latest?cb=20240406232229',
            'https://static.wikia.nocookie.net/marsargo/images/7/75/9bkw5urxqbu.jpg/revision/latest?cb=20200524140831',
            'https://static.wikia.nocookie.net/marsargo/images/e/e2/Tony_Katai_%282015%29_1-002.jpg/revision/latest?cb=20240406231758',
            'https://static.wikia.nocookie.net/marsargo/images/b/ba/70ba1c59a8024d8eae890a643c969b48.jpeg/revision/latest?cb=20220511193735',
            'https://static.wikia.nocookie.net/marsargo/images/8/86/KewlOuttake.jpg/revision/latest?cb=20211227044755',

            'https://static.wikia.nocookie.net/marsargo/images/5/53/Marsargo2015.jpg/revision/latest?cb=20240903195933'
        ]; // All 11 photos restored

        function App() {
            const [openApp, setOpenApp] = useState(null);
            const [timer, setTimer] = useState(216); // 03:36
            const [isMuted, setIsMuted] = useState(false);
            const audioRef = useRef(null);

            useEffect(() => {
                const countdown = setInterval(() => {
                    setTimer(t => t > 0 ? t - 1 : 0);
                }, 1000);
                return () => clearInterval(countdown);
            }, []);

            const playAudio = () => {
                if (audioRef.current) audioRef.current.play().catch(() => {});
            };

            const formatTime = (s) => {
                if (s === 0) return "TIME IS UP";
                const m = Math.floor(s / 60);
                const rs = s % 60;
                return `${m}:${rs < 10 ? '0' : ''}${rs}`;
            };

            return (
                <div className="h-screen w-full relative bg-black text-red-600 overflow-hidden" onClick={playAudio}>
                    <audio ref={audioRef} loop src="https://grocerybag.tv/media/SNOW3.mp3" muted={isMuted} />

                    {/* Top Bar */}
                    <div className="h-8 w-full border-b border-red-900 bg-zinc-900 flex justify-between items-center px-4 fixed top-0 z-50">
                        <div className="text-[10px] font-bold tracking-widest uppercase">
                            ✶ Angels Of SICMR — {formatTime(timer)}
                        </div>
                        <div className="flex gap-4 text-[10px] uppercase opacity-70">
                            <button onClick={() => setIsMuted(!isMuted)}>{isMuted ? 'UNMUTE' : 'MUTE'}</button>
                            <span>grocerybag.tv</span>
                        </div>
                    </div>

                    {/* Desktop Content (Principles Table) */}
                    <div className="absolute inset-0 flex flex-col items-center justify-center opacity-20 pointer-events-none">
                        <h1 className="text-4xl mb-4 font-serif">PRINCIPLES</h1>
                        <div className="text-center text-[10px] space-y-1">
                            <p>LOYALTY GAINS ACCESS</p>
                            <p>ENTRY REQUIRES COMMITMENT</p>
                            <p>DOUBT IS NOISE</p>
                            <p>OBSERVATION BECOMES PARTICIPATION</p>
                        </div>
                    </div>

                    {/* App Windows */}
                    <AnimatePresence>
                        {openApp === 'VIDEOS' && (
                            <Window title="ARCHIVE_LIBRARY" onClose={() => setOpenApp(null)}>
                                <div className="p-4 space-y-6">
                                    {videoLinks.map((url, i) => (
                                        <div key={i} className="border border-red-900/40 p-2">
                                            <p className="text-[8px] mb-1">ENTRY_{i+1}</p>
                                            <iframe src={url} className="w-full aspect-video" frameBorder="0" allowFullScreen></iframe>
                                        </div>
                                    ))}
                                </div>
                            </Window>
                        )}

                        {openApp === 'PHOTOS' && (
                            <Window title="IMAGE_ARCHIVE" onClose={() => setOpenApp(null)}>
                                <div className="grid grid-cols-2 gap-2 p-2">
                                    {photoLinks.map((url, i) => (
                                        <img key={i} src={url} className="w-full border border-red-900 grayscale hover:grayscale-0 transition-all cursor-crosshair" />
                                    ))}
                                </div>
                            </Window>
                        )}
                        
                        {openApp === 'WINSTON' && (
                            <Window title="WINSTON" onClose={() => setOpenApp(null)}>
                                <div className="flex flex-col items-center p-8 text-center space-y-4">
                                    <img src="media/winston.JPG" className="w-32 h-32 rounded-full border-2 border-red-900 grayscale" />
                                    <p className="text-[10px]">LOYALTY IS EXPECTED, NOT REQUESTED.</p>
                                    <a href="https://discord.gg/CRMjDFNBm7" target="_blank" className="border border-red-900 px-4 py-1 text-[10px] hover:bg-red-900 hover:text-white">JOIN DISCORD</a>
                                </div>
                            </Window>
                        )}
                    </AnimatePresence>

                    {/* Dock */}
                    <div className="fixed bottom-6 w-full flex justify-center z-50">
                        <div className="bg-zinc-900 border border-red-900 flex gap-6 p-2 px-8 rounded-full">
                            <button onClick={() => setOpenApp('VIDEOS')} className="hover:scale-110 transition-transform">📽️</button>
                            <button onClick={() => setOpenApp('PHOTOS')} className="hover:scale-110 transition-transform">🖼️</button>
                            <button onClick={() => setOpenApp('WINSTON')} className="hover:scale-110 transition-transform">🐶</button>
                        </div>
                    </div>
                </div>
            );
        }

        function Window({ title, children, onClose }) {
            return (
                <motion.div 
                    initial={{ scale: 0.9, opacity: 0 }}
                    animate={{ scale: 1, opacity: 1 }}
                    exit={{ scale: 0.9, opacity: 0 }}
                    className="absolute top-20 left-10 md:left-1/4 w-[90%] md:w-[600px] h-[500px] bg-zinc-900 border border-red-900 flex flex-col z-40"
                >
                    <div className="bg-red-950/20 border-b border-red-900 p-2 flex justify-between items-center">
                        <span className="text-[9px] font-bold tracking-widest">{title}</span>
                        <button onClick={onClose} className="text-xs hover:text-white px-2">✕</button>
                    </div>
                    <div className="flex-1 overflow-y-auto">
                        {children}
                    </div>
                </motion.div>
            );

        root.render(<App />);
