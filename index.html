<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✶ ANGELS OF SICMR ✶</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Courier New', monospace; transition: background 0.5s ease; }
        .video-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none; opacity: 0.3; filter: grayscale(100%) contrast(110%);
        }
        .video-background iframe {
            width: 100vw; height: 56.25vw;
            min-height: 100vh; min-width: 177.77vh;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #990000; border-radius: 10px; }
        
        .glass-panel {
            backdrop-filter: blur(25px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .dark .glass-panel {
            background: rgba(15, 15, 15, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .illuminati-logo {
            width: 0; height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 14px solid currentColor;
            display: inline-block;
        }

        .traffic-light { width: 12px; height: 12px; border-radius: 50%; cursor: pointer; }
        .close-btn { background: #ff5f56; }
        .minimize-btn { background: #ffbd2e; }
        .expand-btn { background: #27c93f; }

        .winston-img { width: 220px; height: 220px; border-radius: 24px; object-fit: cover; border: 4px solid #990000; }
        .discord-btn { background: #7289da; color: white !important; padding: 12px 24px; border-radius: 12px; font-weight: bold; display: inline-block; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;

        const videoLinks = [
            'https://drive.google.com/file/d/1q7ac9PRUOzAFHfs5xT9i22BnJiAvwNIn/preview', 'https://drive.google.com/file/d/1JXmV-YQbpKJIszF4jPrUMVwhnZrOx6s3/preview', 'https://drive.google.com/file/d/1DWfZc5YAmpgmYltg056luS5G8mfdk4im/preview', 'https://drive.google.com/file/d/1zaaMBdb6oa8xfdSdIcoGpsCNdXkVWU74/preview', 'https://drive.google.com/file/d/1TFQKrUjTj2Pl06LbhBkKQrzdSni70pM4/preview', 'https://drive.google.com/file/d/11ZCGUpoLeS5WSf1c5MYsxWhkPra4AQfr/preview', 'https://drive.google.com/file/d/1RSBFQmDIQDwn1utNzFlHAgkQGh1b_62r/preview', 'https://drive.google.com/file/d/1xZvq0wa_j6OmkXmzjgSW4RokTftRFIo8/preview', 'https://drive.google.com/file/d/133oxgJtwj09sN_QW8ZeSLTfOf1eqx-o9/preview'
        ];

        const photoLinks = [
            'https://static.wikia.nocookie.net/marsargo/images/2/22/Tony_Katai_%28June_2015%29_1-001.jpg/revision/latest?cb=20220524185305', 'https://static.wikia.nocookie.net/marsargo/images/9/97/Tony_Katai_%282015%29_1-010.jpg/revision/latest?cb=20240406232229', 'https://static.wikia.nocookie.net/marsargo/images/7/75/9bkw5urxqbu.jpg/revision/latest?cb=20200524140831', 'https://static.wikia.nocookie.net/marsargo/images/e/e2/Tony_Katai_%282015%29_1-002.jpg/revision/latest?cb=20240406231758', 'https://static.wikia.nocookie.net/marsargo/images/b/ba/70ba1c59a8024d8eae890a643c969b48.jpeg/revision/latest?cb=20220511193735'
        ];

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(false);
            const [username, setUsername] = useState("");
            const [isDark, setIsDark] = useState(true);
            const [isMuted, setIsMuted] = useState(false);
            const [openApps, setOpenApps] = useState({ VIDEOS: false, PHOTOS: false, WINSTON: false, CHAT: false });
            const [zIndices, setZIndices] = useState({ VIDEOS: 10, PHOTOS: 10, WINSTON: 10, CHAT: 10 });
            const [topZ, setTopZ] = useState(20);
            
            const [chatMessages, setChatMessages] = useState([
                { user: "SYSTEM", text: "Welcome to the network." },
                { user: "SYSTEM", text: "JOIN OUR SERVER: https://discord.gg/CRMjDFNBm7" }
            ]);

            const audioRef = useRef(null);

            const theme = isDark ? {
                bg: "bg-black", text: "text-red-600", winBg: "bg-zinc-900/95", winBorder: "border-red-900/40", titleBar: "bg-red-950/20"
            } : {
                bg: "bg-[#d6d2c4]", text: "text-[#4a3f35]", winBg: "bg-[#eceae0]/95", winBorder: "border-[#8c867a]/40", titleBar: "bg-[#b0ab99]/30"
            };

            const bringToFront = (app) => {
                const newZ = topZ + 1;
                setZIndices(prev => ({ ...prev, [app]: newZ }));
                setTopZ(newZ);
            };

            const toggleApp = (app) => {
                setOpenApps(prev => ({ ...prev, [app]: !prev[app] }));
                if (!openApps[app]) bringToFront(app);
            };

            if (!isLoggedIn) {
                return (
                    <div className="h-screen w-full bg-black flex items-center justify-center text-red-600 p-4">
                        <motion.div initial={{ opacity: 0, y: 20 }} animate={{ opacity: 1, y: 0 }} className="glass-panel p-10 rounded-[32px] w-full max-w-sm text-center space-y-6">
                            <div className="illuminati-logo scale-150 mb-2"></div>
                            <h1 className="text-sm font-bold tracking-[0.3em] uppercase opacity-80">Login to SICMR</h1>
                            <input 
                                type="text" 
                                placeholder="Username" 
                                className="w-full bg-black/50 border border-red-900/30 p-3 rounded-xl text-center focus:outline-none focus:border-red-600 transition-all text-sm"
                                value={username}
                                onChange={(e) => setUsername(e.target.value)}
                                onKeyDown={(e) => e.key === 'Enter' && username && setIsLoggedIn(true)}
                            />
                            <button onClick={() => username && setIsLoggedIn(true)} className="w-full bg-red-900/10 hover:bg-red-900/30 border border-red-900/40 py-3 rounded-xl text-xs font-bold tracking-widest transition-all">
                                LOGIN
                            </button>
                        </motion.div>
                    </div>
                );
            }

            return (
                <div className={`h-screen w-full relative transition-colors duration-500 overflow-hidden ${isDark ? 'dark' : ''} ${theme.bg} ${theme.text}`}>
                    <audio ref={audioRef} autoPlay loop src="https://grocerybag.tv/media/SNOW3.mp3" muted={isMuted} />
                    
                    <div className="video-background">
                        <iframe src="https://www.youtube.com/embed/8uy6OhNEg1w?autoplay=1&mute=1&loop=1&playlist=8uy6OhNEg1w&controls=0" frameBorder="0"></iframe>
                    </div>

                    {/* Floating Top Nav */}
                    <div className="fixed top-4 w-full flex justify-center z-[5000] px-6">
                        <div className={`glass-panel h-11 w-full max-w-6xl rounded-full flex justify-between items-center px-6 shadow-2xl`}>
                            <div className="flex items-center text-[10px] font-bold tracking-widest uppercase">
                                <div className="illuminati-logo mr-3"></div>
                                Angels Of SICMR — {username}
                            </div>
                            <div className="flex gap-4 items-center">
                                <button className="text-[9px] border px-3 py-1 rounded-full border-current hover:bg-current hover:text-black transition-all" onClick={() => setIsDark(!isDark)}>
                                    {isDark ? 'LIGHT' : 'DARK'}
                                </button>
                                <button className="text-[9px] font-bold uppercase opacity-70 hover:opacity-100" onClick={() => setIsMuted(!isMuted)}>
                                    {isMuted ? 'Unmute' : 'Mute'}
                                </button>
                            </div>
                        </div>
                    </div>

                    <div className="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none select-none">
                        <h1 className="text-[8vw] font-serif italic text-center">ANGELS OF SICMR</h1>
                    </div>

                    <AnimatePresence>
                        {openApps.VIDEOS && (
                            <Window title="ARCHIVE_LIBRARY" theme={theme} onClose={() => setOpenApps(p => ({...p, VIDEOS: false}))} onFocus={() => bringToFront('VIDEOS')} zIndex={zIndices.VIDEOS} initialX={60} initialY={80}>
                                <div className="p-4 space-y-6">
                                    {videoLinks.map((url, i) => (
                                        <div key={i} className="border border-current/20 p-1 bg-black/40 rounded-xl overflow-hidden">
                                            <iframe src={url} className="w-full aspect-video rounded-lg" frameBorder="0" allowFullScreen></iframe>
                                        </div>
                                    ))}
                                </div>
                            </Window>
                        )}

                        {openApps.PHOTOS && (
                            <Window title="IMAGE_ARCHIVE" theme={theme} onClose={() => setOpenApps(p => ({...p, PHOTOS: false}))} onFocus={() => bringToFront('PHOTOS')} zIndex={zIndices.PHOTOS} initialX={150} initialY={150}>
                                <div className="p-4 space-y-6">
                                    {photoLinks.map((url, i) => (
                                        <img key={i} src={url} className="w-full border border-current/30 shadow-xl rounded-2xl" />
                                    ))}
                                </div>
                            </Window>
                        )}

                        {openApps.CHAT && (
                            <Window title="ENCRYPTED_CHAT" theme={theme} onClose={() => setOpenApps(p => ({...p, CHAT: false}))} onFocus={() => bringToFront('CHAT')} zIndex={zIndices.CHAT} initialX={window.innerWidth - 460} initialY={100}>
                                <div className="flex flex-col h-full">
                                    <div className="flex-1 p-4 overflow-y-auto space-y-3 text-[11px]">
                                        {chatMessages.map((m, i) => (
                                            <div key={i} className="border-l border-current/40 pl-3">
                                                <span className="font-bold opacity-40">[{m.user}]</span><br/>{m.text}
                                            </div>
                                        ))}
                                    </div>
                                    <div className="p-4 border-t border-current/10">
                                        <input 
                                            placeholder="Message..." 
                                            className="w-full bg-transparent outline-none border-b border-current/20 pb-1"
                                            onKeyDown={(e) => {
                                                if(e.key === 'Enter' && e.target.value.trim()){
                                                    setChatMessages([...chatMessages, { user: username, text: e.target.value }]);
                                                    e.target.value = '';
                                                }
                                            }}
                                        />
                                    </div>
                                </div>
                            </Window>
                        )}

                        {openApps.WINSTON && (
                            <Window title="WINSTON" theme={theme} onClose={() => setOpenApps(p => ({...p, WINSTON: false}))} onFocus={() => bringToFront('WINSTON')} zIndex={zIndices.WINSTON} initialX={window.innerWidth/2 - 200} initialY={180} isWinston>
                                <div className="p-8 text-center flex flex-col items-center bg-white text-black h-full">
                                    <h2 className="text-3xl font-black tracking-tighter mb-6">WINSTON CLUB</h2>
                                    <img src="https://grocerybag.tv/media/winston.JPG" className="winston-img mb-8 shadow-2xl" />
                                    <a href="https://discord.gg/CRMjDFNBm7" target="_blank" className="discord-btn shadow-lg hover:scale-105 transition-transform">JOIN SERVER</a>
                                </div>
                            </Window>
                        )}
                    </AnimatePresence>

                    {/* macOS Dock */}
                    <div className="fixed bottom-6 w-full flex justify-center z-[5000]">
                        <div className={`glass-panel p-3 px-8 rounded-[32px] flex gap-10 shadow-2xl items-center`}>
                            <button onClick={() => toggleApp('VIDEOS')} className="text-3xl hover:scale-125 transition-transform">📽️</button>
                            <button onClick={() => toggleApp('PHOTOS')} className="text-3xl hover:scale-125 transition-transform">🖼️</button>
                            <button onClick={() => toggleApp('CHAT')} className="text-3xl hover:scale-125 transition-transform">💬</button>
                            <button onClick={() => toggleApp('WINSTON')} className="text-3xl hover:scale-125 transition-transform">🐶</button>
                        </div>
                    </div>
                </div>
            );
        }

        function Window({ title, children, onClose, onFocus, theme, isWinston, zIndex, initialX, initialY }) {
            return (
                <motion.div 
                    drag dragMomentum={false} onDragStart={onFocus}
                    initial={{ opacity: 0, scale: 0.9, x: initialX, y: initialY }}
                    animate={{ opacity: 1, scale: 1 }}
                    exit={{ opacity: 0, scale: 0.9 }}
                    style={{ zIndex: zIndex, position: 'absolute' }}
                    className={`w-[420px] h-[500px] border shadow-2xl flex flex-col rounded-[24px] overflow-hidden backdrop-blur-2xl ${theme.winBg} ${theme.winBorder}`}
                >
                    <div className={`${theme.titleBar} p-4 flex items-center relative cursor-grab active:cursor-grabbing`}>
                        <div className="flex gap-2 absolute left-4">
                            <div onClick={(e) => { e.stopPropagation(); onClose(); }} className="traffic-light close-btn"></div>
                            <div className="traffic-light minimize-btn"></div>
                            <div className="traffic-light expand-btn"></div>
                        </div>
                        <span className="text-[10px] font-bold tracking-widest uppercase w-full text-center opacity-50 pointer-events-none">{title}</span>
                    </div>
                    <div className={`flex-1 overflow-y-auto ${isWinston ? 'bg-white rounded-b-[24px]' : ''}`}>
                        {children}
                    </div>
                </motion.div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
