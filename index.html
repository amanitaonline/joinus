<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XXXO</title>
    <style>
        body {
            background-color: #000;
            /* Added a subtle glitter texture to the background */
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .wrapper {
            padding: 10px;
            box-sizing: border-box;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            container-type: inline-size;
            width: 100%;
            max-width: 1200px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1; /* Keep content above sparkles */
        }

        .font {
            font-family: 'Helvetica', Arial, sans-serif;
            font-weight: bold;
            font-size: 3.5cqw; 
            text-align: center;
            text-transform: uppercase;
            width: 100%;
            margin: 20px 0;
            text-decoration: none;
            letter-spacing: 1px;
            /* Added a text shadow for extra 'pop' */
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .flash {
            animation: flash-effect 0.14s infinite; 
        }

        @keyframes flash-effect {
            0%, 49% { color: red; }
            50%, 100% { color: white; }
        }
        
        .contact {
            color: white;
            transition: color 0.3s;
        }

        .contact:hover {
            color: red;
            text-decoration: underline;
        }

        .embed {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #111;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3); /* Subtle glow */
        }

        .embed iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* Sparkle Styles */
        .sparkle {
            position: absolute;
            width: 5px;
            height: 5px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 10px 2px white, 0 0 15px 4px red;
            animation: sparkle-fade 0.8s linear forwards;
        }

        @keyframes sparkle-fade {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }

        @media (max-width: 800px) {
            .dynamic-text {
                font-size: 5cqw;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="container">
            
            <div class="font flash">
                YOU WANT ME BE SOMEBODY WHO I'M REALLY NOT
            </div>

            <div class="embed">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/sfbQ5mHWkOs?si=cv1IE-oOnE3cX6O3" title="XXXO" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>

            <a href="mailto:matangi@atomicmail.io" class="font contact">
                CONTACT
            </a>
            
        </div>
    </div>

    <script>
        // Y2K Sparkle Trail Logic
        document.addEventListener('mousemove', (e) => {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            
            // Randomize sparkle color between white and red
            if (Math.random() > 0.5) {
                sparkle.style.background = 'red';
                sparkle.style.boxShadow = '0 0 10px 2px red';
            }

            sparkle.style.left = e.pageX + 'px';
            sparkle.style.top = e.pageY + 'px';
            
            // Random trajectory
            const destinationX = (Math.random() - 0.5) * 50;
            const destinationY = (Math.random() - 0.5) * 50;
            
            sparkle.style.setProperty('--x', destinationX + 'px');
            sparkle.style.setProperty('--y', destinationY + 'px');

            document.body.appendChild(sparkle);

            setTimeout(() => {
                sparkle.remove();
            }, 800);
        });
    </script>

</body>
</html>
