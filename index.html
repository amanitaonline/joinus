<script>
// TIMER
var time = 216;
var timerElement = document.getElementById("timer");
function updateTimer() {
  if(document.getElementById("main").classList.contains("active")) {
    var minutes = Math.floor(time / 60);
    var seconds = time % 60;
    if(seconds<10) seconds="0"+seconds;
    if(time>0) timerElement.innerHTML = minutes+":"+seconds;
    else timerElement.innerHTML="awh poor Brittany. Nobody cared. You're dead.";
    time--;
  } else { timerElement.innerHTML=""; }
}
setInterval(updateTimer,1000);

// TABS
function openTab(tabName){
  var tabs = document.getElementsByClassName('tab-content');
  for(var i=0;i<tabs.length;i++){ tabs[i].classList.remove('active'); }
  document.getElementById(tabName).classList.add('active');
  
  var tabButtons = document.getElementsByClassName('tab');
  for(var i=0;i<tabButtons.length;i++){ tabButtons[i].classList.remove('active'); }
  document.querySelector('.tab[onclick*="'+tabName+'"]').classList.add('active');
}

// CHAT
var username = '';
window.onload = function(){
  username = prompt('Choose a username before chatting:');
  if(username && username.trim()!==''){
    document.getElementById('chatInput').removeAttribute('readonly');
    document.getElementById('chatInput').placeholder='type your message here';
    document.getElementById('chatButton').disabled=false;
  }
  loadVideos();
  loadPhotos();
}
function sendMessage(){
  var input=document.getElementById('chatInput');
  var log=document.getElementById('chatLog');
  if(input.value.trim()!==''){
    log.innerHTML+='<div>'+username+': '+input.value+'</div>';
    log.scrollTop = log.scrollHeight;
    input.value='';
  }
}

var currentPage=0;
var perPage=5;

function loadVideos(){
  var list=document.getElementById('videoList');
  list.innerHTML='';
  var start=currentPage*perPage;
  var end=Math.min(start+perPage,videos.length);
  for(var i=start;i<end;i++){
    list.innerHTML+='<div class="video-item"><iframe src="'+videos[i]+'" width="560" height="315" allowfullscreen></iframe></div>';
  }
}

function nextPage(){ if((currentPage+1)*perPage<videos.length){ currentPage++; loadVideos(); } }
function prevPage(){ if(currentPage>0){ currentPage--; loadVideos(); } }

var currentPhotoPage=0;
var photosPerPage=6;

function loadPhotos(){
  var grid=document.getElementById('photoGrid');
  grid.innerHTML='';
  var start=currentPhotoPage*photosPerPage;
  var end=Math.min(start+photosPerPage,photos.length);
  for(var i=start;i<end;i++){
    grid.innerHTML+='<div class="photo-item"><img src="'+photos[i]+'"></div>';
  }
}
function nextPhotoPage(){ if((currentPhotoPage+1)*photosPerPage<photos.length){ currentPhotoPage++; loadPhotos(); } }
function prevPhotoPage(){ if(currentPhotoPage>0){ currentPhotoPage--; loadPhotos(); } }

// WINSTON AUDIO
const audio=document.getElementById('backgroundAudio');
const btn=document.getElementById('muteBtn');
window.addEventListener('load',()=>{ audio.play().catch(()=>{ btn.textContent='where is all the snow?'; }); });
audio.muted=false; btn.textContent='mute';
btn.addEventListener('click',()=>{
  if(audio.paused){ audio.play(); btn.textContent='mute'; }
  else{ audio.muted=!audio.muted; btn.textContent=audio.muted?'unmute':'mute'; }
});
