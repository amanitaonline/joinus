<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✶ ANGELS OF SICMR ✶</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-draggable/4.4.6/react-draggable.min.js"></script>
    <style>
        body { overflow: hidden; font-family: 'Courier New', monospace; transition: background 0.3s ease; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #990000; }
        .winston-content { background: white !important; color: black !important; }
        .discord-link { font-size:1.2rem; background-color:#7289da; color:#fff; padding:10px 20px; border-radius:10px; text-decoration:none; font-weight:bold; border:2px solid #990000; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;
        const Draggable = window.ReactDraggable;

        const videoLinks = [
            'https://drive.google.com/file/d/1q7ac9PRUOzAFHfs5xT9i22BnJiAvwNIn/preview',
            'https://drive.google.com/file/d/1JXmV-YQbpKJIszF4jPrUMVwhnZrOx6s3/preview',
            'https://www.youtube.com/embed/8uy6OhNEg1w',
            'https://drive.google.com/file/d/1DWfZc5YAmpgmYltg056luS5G8mfdk4im/preview'
        ];

        function App() {
            const [isDark, setIsDark] = useState(true);
            const [openApps, setOpenApps] = useState({ CHAT: false, VIDEOS: false, PHOTOS: false, WINSTON: false });
            const [timer, setTimer] = useState(216);
            const [isMuted, setIsMuted] = useState(false);
            const audioRef = useRef(null);

            // Theme Definitions
            const theme = isDark ? {
                bg: "bg-black",
                text: "text-red-600",
                bar: "bg-zinc-900 border-red-900",
                winBg: "bg-zinc-900",
                winBorder: "border-red-900",
                handle: "bg-red-950 text-red-500"
            } : {
                bg: "bg-[#d6d2c4]", // Bone Grey
                text: "text-[#4a3f35]", // Brownish
                bar: "bg-[#c2beb0] border-[#8c867a]",
                winBg: "bg-[#eceae0]",
                winBorder: "border-[#8c867a]",
                handle: "bg-[#b0ab99] text-[#4a3f35]"
            };

            useEffect(() => {
                const countdown = setInterval(() => setTimer(t => t > 0 ? t - 1 : 0), 1000);
                return () => clearInterval(countdown);
            }, []);

            const toggleApp = (app) => setOpenApps(prev => ({ ...prev, [app]: !prev[app] }));

            return (
                <div className={`h-screen w-full relative transition-colors duration-500 ${theme.bg} ${theme.text}`} onClick={() => audioRef.current?.play()}>
                    <audio ref={audioRef} loop src="https://grocerybag.tv/media/SNOW3.mp3" muted={isMuted} />

                    {/* Top Bar */}
                    <div className={`h-8 w-full border-b flex justify-between items-center px-4 fixed top-0 z-[100] ${theme.bar}`}>
                        <div className="text-[10px] font-bold tracking-widest uppercase">
                            ✶ SICMR_OS — {Math.floor(timer/60)}:{String(timer%60).padStart(2,'0')}
                        </div>
                        <div className="flex gap-4 items-center">
                            <button className="text-[9px] border px-2 py-0.5 rounded hover:bg-white/10" onClick={() => setIsDark(!isDark)}>
                                {isDark ? 'LIGHT MODE' : 'DARK MODE'}
                            </button>
                            <button className="text-[9px]" onClick={() => setIsMuted(!isMuted)}>{isMuted ? 'UNMUTE' : 'MUTE'}</button>
                        </div>
                    </div>

                    {/* Desktop Workspace */}
                    <div className="absolute inset-0 flex flex-col items-center justify-center opacity-10 pointer-events-none">
                        <h1 className="text-6xl font-serif italic">PRINCIPLES</h1>
                    </div>

                    {/* Multi-Window Environment */}
                    <AnimatePresence>
                        {openApps.VIDEOS && (
                            <Window title="ARCHIVE" theme={theme} onClose={() => toggleApp('VIDEOS')} defaultPos={{x: 50, y: 100}}>
                                <div className="p-4 space-y-4">
                                    {videoLinks.map((url, i) => <iframe key={i} src={url} className="w-full aspect-video border border-current" frameBorder="0" allowFullScreen />)}
                                </div>
                            </Window>
                        )}

                        {openApps.WINSTON && (
                            <Window title="WINSTON" theme={theme} onClose={() => toggleApp('WINSTON')} defaultPos={{x: 400, y: 150}} isWinston>
                                <div className="winston-content p-8 h-full flex flex-col items-center text-center space-y-6">
                                    <font face="Times New Roman" size="+2"><b>WINSTON FAN CLUB</b></font>
                                    <img src="media/winston.JPG" className="w-48 border-4 border-red-600 rounded-lg shadow-xl" />
                                    <a href="https://discord.gg/CRMjDFNBm7" target="_blank" className="discord-link">JOIN THE DISCORD!</a>
                                    <p className="text-black italic">Loyalty is expected.</p>
                                </div>
                            </Window>
                        )}

                        {openApps.CHAT && (
                            <Window title="CHAT" theme={theme} onClose={() => toggleApp('CHAT')} defaultPos={{x: 100, y: 300}}>
                                <div className="p-4 h-full flex flex-col gap-2">
                                    <div className="flex-1 border border-current p-2 text-xs overflow-y-auto min-h-[100px]">
                                        SYSTEM: Encryption active...
                                    </div>
                                    <input className="bg-transparent border border-current p-1 text-xs outline-none" placeholder="Type here..." />
                                </div>
                            </Window>
                        )}
                    </AnimatePresence>

                    {/* Dock */}
                    <div className="fixed bottom-6 w-full flex justify-center z-[100]">
                        <div className={`${theme.bar} border flex gap-8 p-3 px-10 rounded-full shadow-2xl backdrop-blur-md`}>
                            <button onClick={() => toggleApp('CHAT')} className="text-xl hover:scale-125 transition-transform">💬</button>
                            <button onClick={() => toggleApp('VIDEOS')} className="text-xl hover:scale-125 transition-transform">📽️</button>
                            <button onClick={() => toggleApp('WINSTON')} className="text-xl hover:scale-125 transition-transform">🐶</button>
                        </div>
                    </div>
                </div>
            );
        }

        function Window({ title, children, onClose, theme, defaultPos, isWinston }) {
            return (
                <Draggable handle=".handle" defaultPosition={defaultPos}>
                    <motion.div 
                        initial={{ opacity: 0, scale: 0.95 }} animate={{ opacity: 1, scale: 1 }} exit={{ opacity: 0, scale: 0.95 }}
                        className={`absolute w-80 md:w-[450px] border-2 shadow-2xl z-20 overflow-hidden flex flex-col ${theme.winBg} ${theme.winBorder}`}
                        style={{ minHeight: '200px' }}
                    >
                        <div className={`handle p-2 px-3 flex justify-between items-center cursor-grab active:cursor-grabbing border-b ${theme.handle} ${theme.winBorder}`}>
                            <span className="text-[10px] font-bold tracking-widest uppercase">{title}</span>
                            <button onClick={onClose} className="font-bold hover:scale-110">✕</button>
                        </div>
                        <div className={`flex-1 overflow-y-auto ${isWinston ? 'bg-white' : ''}`}>
                            {children}
                        </div>
                    </motion.div>
                </Draggable>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
