<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XXXO</title>
    <style>
        body {
            background-color: #000;
            margin: 0;
            padding: 0;
        }

        .wrapper {
            padding: 10px;
            box-sizing: border-box;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            container-type: inline-size;
            width: 100%;
            max-width: 1200px; 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .font {
            font-family: 'Helvetica', Arial, sans-serif;
            font-weight: bold;
            font-size: 3.5cqw; 
            text-align: center;
            text-transform: uppercase;
            width: 100%;
            margin: 20px 0;
            text-decoration: none;
            letter-spacing: 1px;
        }

        .flash {
            animation: flash-effect 0.14s infinite; 
        }

        @keyframes flash-effect {
            0%, 49% { color: red; }
            50%, 100% { color: white; }
        }
        .contact {
            color: white;
            transition: color 0.3s;
        }

        .contact:hover {
            color: red;
        }
        .embed {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #111;
        }
        .embed iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        @media (max-width: 800px) {
            .margin-wrapper {
                padding: 50px; 
            }
            .dynamic-text {
                font-size: 5cqw;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="container">
            
            <div class="font flash">
                YOU WANT ME BE SOMEBODY WHO I'M REALLY NOT
            </div>

            <div class="embed">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/sfbQ5mHWkOs?si=cv1IE-oOnE3cX6O3" title="XXXO" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>

            <a href="mailto:matangi@atomicmail.io" class="font contact">
                CONTACT
            </a>
            
        </div>
    </div>

</body>
</html>
