<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XXXO</title>
    <style>
        body {
            background-color: #000;
            background-image: url('https://www.transparenttextures.com/patterns/stardust.png');
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            cursor: crosshair;
        }

        .wrapper {
            padding: 10px;
            box-sizing: border-box;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            container-type: inline-size;
            width: 100%;
            max-width: 1200px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1; 
        }

        .font {
            font-family: 'Helvetica', Arial, sans-serif;
            font-weight: bold;
            font-size: 3.5cqw; 
            text-align: center;
            text-transform: uppercase;
            width: 100%;
            margin: 20px 0;
            text-decoration: none;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .flash {
            animation: flash-effect 0.14s infinite; 
        }

        @keyframes flash-effect {
            0%, 49% { color: red; }
            50%, 100% { color: white; }
        }
        
        .contact {
            color: white;
            transition: color 0.3s;
        }

        .contact:hover {
            color: red;
            text-decoration: underline;
        }

        .embed {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #111;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3); 
        }

        .embed iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* NEW HYBRID SPARKLE STYLE */
        .sparkle-star {
            position: absolute;
            pointer-events: none;
            font-size: 24px;
            z-index: 9999;
            color: white;
            text-shadow: 0 0 10px #fff;
            animation: burst 0.8s ease-out forwards;
        }

        @keyframes burst {
            0% { 
                transform: translate(0, 0) scale(1) rotate(0deg); 
                opacity: 1; 
            }
            100% { 
                transform: translate(var(--x), var(--y)) scale(0) rotate(180deg); 
                opacity: 0; 
            }
        }

        @media (max-width: 800px) {
            .dynamic-text {
                font-size: 5cqw;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <div class="container">
            
            <div class="font flash">
                YOU WANT ME BE SOMEBODY WHO I'M REALLY NOT
            </div>

            <div class="embed">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/sfbQ5mHWkOs?si=cv1IE-oOnE3cX6O3" title="XXXO" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>

            <a href="mailto:matangi@atomicmail.io" class="font contact">
                CONTACT
            </a>
            
        </div>
    </div>

    <script>
        // Hybrid "✦" Sparkle Burst Logic
        document.addEventListener('mousemove', (e) => {
            if (Math.random() > 0.7) {
                const star = document.createElement('div');
                star.className = 'sparkle-star';
                star.innerHTML = '✦';
                
                // Random burst trajectory
                const destinationX = (Math.random() - 0.5) * 100;
                const destinationY = (Math.random() - 0.5) * 100;
                star.style.setProperty('--x', destinationX + 'px');
                star.style.setProperty('--y', destinationY + 'px');

                // Randomize color between Red and White with Glow
                if(Math.random() > 0.5) {
                    star.style.color = 'red';
                    star.style.textShadow = '0 0 10px red, 0 0 20px #ff0000';
                }

                star.style.left = e.pageX + 'px';
                star.style.top = e.pageY + 'px';
                
                document.body.appendChild(star);
                
                setTimeout(() => {
                    star.remove();
                }, 800);
            }
        });
    </script>

</body>
</html>
