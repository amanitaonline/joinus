<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✶ ANGELS OF SICMR ✶</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: 'Courier New', monospace; transition: background 0.5s ease; }
        .video-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; pointer-events: none; opacity: 0.35; filter: grayscale(100%) contrast(110%);
        }
        .video-background iframe {
            width: 100vw; height: 56.25vw;
            min-height: 100vh; min-width: 177.77vh;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #990000; border-radius: 10px; }
        
        .winston-content { background: white !important; color: black !important; font-family: 'Times New Roman', serif; }
        .discord-btn { background: #7289da; color: white !important; padding: 10px 24px; border-radius: 12px; font-weight: bold; border: 2px solid #990000; display: inline-block; }
        
        /* macOS Style Traffic Lights */
        .traffic-light { width: 12px; height: 12px; border-radius: 50%; display: inline-block; cursor: pointer; }
        .close-btn { background: #ff5f56; }
        .minimize-btn { background: #ffbd2e; }
        .expand-btn { background: #27c93f; }
        
        /* Floating Dock Blur */
        .mac-dock {
            backdrop-filter: blur(20px);
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .dark .mac-dock {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = window.Motion;

        const videoLinks = [
            'https://drive.google.com/file/d/1q7ac9PRUOzAFHfs5xT9i22BnJiAvwNIn/preview', 'https://drive.google.com/file/d/1JXmV-YQbpKJIszF4jPrUMVwhnZrOx6s3/preview', 'https://drive.google.com/file/d/1DWfZc5YAmpgmYltg056luS5G8mfdk4im/preview', 'https://drive.google.com/file/d/1zaaMBdb6oa8xfdSdIcoGpsCNdXkVWU74/preview', 'https://drive.google.com/file/d/1TFQKrUjTj2Pl06LbhBkKQrzdSni70pM4/preview', 'https://drive.google.com/file/d/11ZCGUpoLeS5WSf1c5MYsxWhkPra4AQfr/preview', 'https://drive.google.com/file/d/1RSBFQmDIQDwn1utNzFlHAgkQGh1b_62r/preview', 'https://drive.google.com/file/d/1xZvq0wa_j6OmkXmzjgSW4RokTftRFIo8/preview', 'https://drive.google.com/file/d/133oxgJtwj09sN_QW8ZeSLTfOf1eqx-o9/preview', 'https://drive.google.com/file/d/1Zr5qBZGjPPKlYFJi6pMNpZrdq7hqV9UU/preview', 'https://drive.google.com/file/d/1Wl8qMjUGRSkrsVe_r9cAV8guWpcZSs1Z/preview', 'https://web.archive.org/web/20120226011651oe_/http://v1.cache1.c.youtube.com/videoplayback?sparams=id%2Cexpire%2Cip%2Cipbits%2Citag%2Csource%2Cratebypass%2Ccp&fexp=914023%2C906500%2C914102&itag=45&ip=207.0.0.0&signature=0462702E6899831AA8F11D392929B9579639F2D2.98B611320866F2C521B2200D0BA40D9792E90974&sver=3&ratebypass=yes&source=youtube&expire=1330244443&key=yt1&ipbits=8&cp=U0hSRVJPUl9JTUNOMl9KSVZFOl9icENCYjJyYWly&id=bca4844902a58242&redirect_counter=1', 'https://drive.google.com/file/d/14LNJHStYFzFlJdUFv3EoWww8DUImhjfT/preview', 'https://drive.google.com/file/d/1pVLNodC8gqYIv-9MI6Hg9m4TFxEwRm1j/preview', 'https://drive.google.com/file/d/1vXpkO2fSfLgy70i-zIHrfrveoEyCySyU/preview', 'https://drive.google.com/file/d/1tgJRuhXNjDUqmnGaYmgGxGwZ6T229zWI/preview', 'https://drive.google.com/file/d/1F7XMY7yHovr-j-kbxe1bZPmWMsyTNzIk/preview', 'https://drive.google.com/file/d/1GYdIwNcPO5kmeZMHl_3NbMI9UidL6-K9/preview', 'https://drive.google.com/file/d/1i-CwzuInjqY4RvYwgBBeVRrucBXWrikz/preview', 'https://drive.google.com/file/d/1V897Rk40PX6Xt8rOix6PsArhyQtimoKo/preview', 'https://drive.google.com/file/d/14o4XlH1o_oL_c1qJwg5_vUIE6ZyNsyXu/preview', 'https://drive.google.com/file/d/1GB7ConILrKSIMRW2RPZUJedZHiLcov8p/preview', 'https://drive.google.com/file/d/1AcnFKhWOSYBPiKjUjbYhY2zDQTMC798i/preview', 'https://drive.google.com/file/d/1teOsyrRDUMXy80l3QsMqByqDiil9iQ8o/preview', 'https://web.archive.org/web/20120622071749oe_/http://o-o.preferred.nuq04s10.v21.lscache3.c.youtube.com/videoplayback?upn=MQ0QxqjzUwc&sparams=cp%2Cid%2Cip%2Cipbits%2Citag%2Cratebypass%2Csource%2Cupn%2Cexpire&fexp=905604%2C906335%2C905600%2C923002%2C902517%2C907217%2C907335%2C921602%2C919306%2C922600%2C919316%2C920704%2C912804%2C913542%2C919324%2C907344%2C912706&ms=au&itag=45&ip=207.0.0.0&signature=0B550FE7FCC9A4456F05DD3F78238028441DD5DB.31E144A94770C2414DE6539BEF5A568DCC32AEF0&sver=3&mt=1340349013&ratebypass=yes&source=youtube&expire=1340372997&key=yt1&ipbits=8&cp=U0hSRVNSUF9OUUNOM19LTFRKOnRGNmt4Z0dWTXhq&id=1f0a898373a952ab', 'https://web.archive.org/web/20121210025752oe_/http://r4---sn-a5m7zu7s.c.youtube.com/videoplayback?upn=Pbc5Q_wBh3Y&sparams=cp%2Cid%2Cip%2Cipbits%2Citag%2Cratebypass%2Csource%2Cupn%2Cexpire&fexp=901803%2C918106%2C910013%2C914086%2C916611%2C922401%2C920704%2C912806%2C925703%2C925706%2C928001%2C922403%2C922405%2C929901%2C913605%2C913546%2C913556%2C920201%2C913302%2C911116%2C901451%2C902556&key=yt1&expire=1355129371&itag=22&ipbits=8&sver=3&ratebypass=yes&mt=1355108222&ip=207.241.237.138&mv=m&source=youtube&ms=tsu&cp=U0hUSlFNV19MS0NONF9JR0FEOkNQa3pzUEdvODRC&id=8a7b6e64b7a17e0a&signature=33EF7B450A041FFC756A231E36686C6D2477EB53.2CD494C79ECD687DD08657C1E2422BF552FA99C7&redirect_counter=1', 'https://drive.google.com/file/d/1BUh2Oi2zoT1Y8FBp94MLB9lIDMpbe9fK/preview', 'https://drive.google.com/file/d/1Zu1yZ_8v1V1Al3OyG5l2rCbVw9ES2iL9/preview', 'https://drive.google.com/file/d/1G6PpfeQqKnkgdBN63YZk2058ksx6PcUi/preview', 'https://drive.google.com/file/d/1ehqGDqlLREUwR6ihmO3KurEEbtt7gxO5/preview', 'https://drive.google.com/file/d/1orIhGHZzCkHXTcEPyeQTUD9dHKATCpSg/preview', 'https://drive.google.com/file/d/1WzB2I3ojjPt2ZqgorW3Bxyqu3dt0zmSh/preview', 'https://drive.google.com/file/d/1wwCLwE03wY9ogZmCLspq_CDjvjJJY4pW/preview'
        ];

        const photoLinks = [
            'https://static.wikia.nocookie.net/marsargo/images/2/22/Tony_Katai_%28June_2015%29_1-001.jpg/revision/latest?cb=20220524185305', 'https://static.wikia.nocookie.net/marsargo/images/9/97/Tony_Katai_%282015%29_1-010.jpg/revision/latest?cb=20240406232229', 'https://static.wikia.nocookie.net/marsargo/images/7/75/9bkw5urxqbu.jpg/revision/latest?cb=20200524140831', 'https://static.wikia.nocookie.net/marsargo/images/e/e2/Tony_Katai_%282015%29_1-002.jpg/revision/latest?cb=20240406231758', 'https://static.wikia.nocookie.net/marsargo/images/b/ba/70ba1c59a8024d8eae890a643c969b48.jpeg/revision/latest?cb=20220511193735', 'https://static.wikia.nocookie.net/marsargo/images/8/86/KewlOuttake.jpg/revision/latest?cb=20211227044755', 'https://static.wikia.nocookie.net/marsargo/images/8/89/2015-10-11_11.10.39_1093537410520121192_362742494.jpg/revision/latest?cb=20170831231034', 'https://static.wikia.nocookie.net/marsargo/images/c/c4/Tumblr_osigop18Bt1uftv1so2_1280.jpg/revision/latest?cb=20170831213314', 'https://static.wikia.nocookie.net/marsargo/images/3/34/Tumblr_osigop18Bt1uftv1so1_1280.jpg/revision/latest?cb=20170831213313', 'https://static.wikia.nocookie.net/marsargo/images/5/5b/WRIFURHE.jpg/revision/latest?cb=20240903201454', 'https://static.wikia.nocookie.net/marsargo/images/5/53/Marsargo2015.jpg/revision/latest?cb=20240903195933'
        ];

        function App() {
            const [isDark, setIsDark] = useState(true);
            const [openApps, setOpenApps] = useState({ VIDEOS: false, PHOTOS: false, WINSTON: false });
            const [zIndices, setZIndices] = useState({ VIDEOS: 10, PHOTOS: 10, WINSTON: 10 });
            const [topZ, setTopZ] = useState(20);
            const [timer, setTimer] = useState(216);
            const [isMuted, setIsMuted] = useState(false);
            const audioRef = useRef(null);

            const theme = isDark ? {
                bg: "bg-black", text: "text-red-600", bar: "bg-zinc-950/80 border-red-900",
                winBg: "bg-zinc-900/95", winBorder: "border-red-900/50", titleBar: "bg-red-950/10"
            } : {
                bg: "bg-[#d6d2c4]", text: "text-[#4a3f35]", bar: "bg-[#c2beb0]/80 border-[#8c867a]",
                winBg: "bg-[#eceae0]/95", winBorder: "border-[#8c867a]/50", titleBar: "bg-[#b0ab99]/20"
            };

            useEffect(() => {
                const countdown = setInterval(() => setTimer(t => t > 0 ? t - 1 : 0), 1000);
                return () => clearInterval(countdown);
            }, []);

            const bringToFront = (app) => {
                const newZ = topZ + 1;
                setZIndices(prev => ({ ...prev, [app]: newZ }));
                setTopZ(newZ);
            };

            const toggleApp = (app) => {
                if (!openApps[app]) setOpenApps(prev => ({ ...prev, [app]: true }));
                bringToFront(app);
            };

            return (
                <div className={`h-screen w-full relative transition-colors duration-500 overflow-hidden ${isDark ? 'dark' : ''} ${theme.bg} ${theme.text}`} onClick={() => audioRef.current?.play()}>
                    <audio ref={audioRef} loop src="https://grocerybag.tv/media/SNOW3.mp3" muted={isMuted} />
                    
                    <div className="video-background">
                        <iframe src="https://www.youtube.com/embed/8uy6OhNEg1w?autoplay=1&mute=1&loop=1&playlist=8uy6OhNEg1w&controls=0&showinfo=0" frameBorder="0"></iframe>
                    </div>

                    {/* Top Menu Bar */}
                    <div className={`h-7 w-full border-b flex justify-between items-center px-4 fixed top-0 z-[1000] backdrop-blur-md ${theme.bar}`}>
                        <div className="text-[10px] font-bold tracking-widest uppercase">
                            ✶ Angels Of SICMR — {Math.floor(timer/60)}:{String(timer%60).padStart(2,'0')}
                        </div>
                        <div className="flex gap-4 items-center">
                            <button className="text-[9px] border px-2 py-0.5 rounded-full border-current" onClick={() => setIsDark(!isDark)}>
                                {isDark ? 'LIGHT' : 'DARK'}
                            </button>
                            <button className="text-[9px] font-bold" onClick={(e) => { e.stopPropagation(); setIsMuted(!isMuted); }}>
                                {isMuted ? 'UNMUTE' : 'MUTE'}
                            </button>
                        </div>
                    </div>

                    <div className="absolute inset-0 flex items-center justify-center opacity-20 pointer-events-none">
                        <h1 className="text-7xl font-serif italic text-center">ANGELS OF SICMR</h1>
                    </div>

                    <AnimatePresence>
                        {openApps.VIDEOS && (
                            <Window title="ARCHIVE_LIBRARY" theme={theme} 
                                onClose={() => setOpenApps(p => ({...p, VIDEOS: false}))} 
                                onFocus={() => bringToFront('VIDEOS')}
                                zIndex={zIndices.VIDEOS}
                                pos="left-[8%] top-20"
                            >
                                <div className="p-4 space-y-8">
                                    {videoLinks.map((url, i) => (
                                        <div key={i} className="border border-current p-2 bg-black/30 rounded-lg">
                                            <p className="text-[8px] mb-2">ENTRY_FILE_{i+1}</p>
                                            <iframe src={url} className="w-full aspect-video rounded" frameBorder="0" allowFullScreen></iframe>
                                        </div>
                                    ))}
                                </div>
                            </Window>
                        )}

                        {openApps.PHOTOS && (
                            <Window title="IMAGE_ARCHIVE" theme={theme} 
                                onClose={() => setOpenApps(p => ({...p, PHOTOS: false}))} 
                                onFocus={() => bringToFront('PHOTOS')}
                                zIndex={zIndices.PHOTOS}
                                pos="left-1/2 -translate-x-1/2 top-32"
                            >
                                <div className="grid grid-cols-1 gap-6 p-4">
                                    {photoLinks.map((url, i) => (
                                        <img key={i} src={url} className="w-full border border-current shadow-lg rounded-xl" />
                                    ))}
                                </div>
                            </Window>
                        )}

                        {openApps.WINSTON && (
                            <Window title="WINSTON" theme={theme} 
                                onClose={() => setOpenApps(p => ({...p, WINSTON: false}))} 
                                onFocus={() => bringToFront('WINSTON')}
                                zIndex={zIndices.WINSTON}
                                pos="right-[8%] top-24" 
                                isWinston
                            >
                                <div className="winston-content p-10 h-full flex flex-col items-center text-center space-y-8">
                                    <h2 className="text-3xl font-bold tracking-tighter">WINSTON FAN CLUB</h2>
                                    <img src="media/winston.JPG" className="w-56 h-56 rounded-3xl border-4 border-red-900 shadow-2xl object-cover" />
                                    <a href="https://discord.gg/CRMjDFNBm7" target="_blank" className="discord-btn">JOIN DISCORD</a>
                                </div>
                            </Window>
                        )}
                    </AnimatePresence>

                    {/* macOS Dock */}
                    <div className="fixed bottom-6 w-full flex justify-center z-[1000]">
                        <div className={`mac-dock p-3 px-8 rounded-[24px] flex gap-8 shadow-2xl items-center`}>
                            <button onClick={() => toggleApp('VIDEOS')} className="text-3xl hover:scale-125 transition-all duration-200">📽️</button>
                            <button onClick={() => toggleApp('PHOTOS')} className="text-3xl hover:scale-125 transition-all duration-200">🖼️</button>
                            <button onClick={() => toggleApp('WINSTON')} className="text-3xl hover:scale-125 transition-all duration-200">🐶</button>
                        </div>
                    </div>
                </div>
            );
        }

        function Window({ title, children, onClose, onFocus, theme, isWinston, pos, zIndex }) {
            return (
                <motion.div 
                    initial={{ scale: 0.9, opacity: 0 }} 
                    animate={{ scale: 1, opacity: 1 }} 
                    exit={{ scale: 0.9, opacity: 0 }}
                    onMouseDown={onFocus}
                    style={{ zIndex: zIndex }}
                    className={`absolute ${pos} w-[90%] md:w-[500px] h-[540px] border shadow-2xl flex flex-col rounded-[18px] overflow-hidden backdrop-blur-xl ${theme.winBg} ${theme.winBorder}`}
                >
                    <div className={`${theme.titleBar} border-b ${theme.winBorder} p-3 px-4 flex items-center relative cursor-move`}>
                        <div className="flex gap-2 absolute left-4">
                            <div onClick={(e) => { e.stopPropagation(); onClose(); }} className="traffic-light close-btn"></div>
                            <div className="traffic-light minimize-btn"></div>
                            <div className="traffic-light expand-btn"></div>
                        </div>
                        <span className="text-[10px] font-bold tracking-widest uppercase w-full text-center opacity-70">{title}</span>
                    </div>
                    <div className={`flex-1 overflow-y-auto ${isWinston ? 'bg-white rounded-b-[18px]' : ''}`}>
                        {children}
                    </div>
                </motion.div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
