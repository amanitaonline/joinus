<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>White to transparent</title>
<style>
:root{--bg:#eceae6;--fg:#1d1d1b;--mute:#6f6c66;--line:#cfccc5;--panel:#f6f5f2;--acc:#3b4a3f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#191918;--fg:#e9e7e2;--mute:#8d8a83;--line:#33322f;--panel:#222220;--acc:#a9bfae}}
:root[data-theme="dark"]{--bg:#191918;--fg:#e9e7e2;--mute:#8d8a83;--line:#33322f;--panel:#222220;--acc:#a9bfae}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 20px 48px;display:grid;gap:20px;grid-template-columns:minmax(0,1fr) 270px}
@media (max-width:760px){main{grid-template-columns:1fr}}
h1{grid-column:1/-1;margin:0;font-size:22px;font-weight:600;letter-spacing:-.01em}
h1 span{display:block;font-size:14px;font-weight:400;color:var(--mute);margin-top:2px}
#stage{min-height:340px;border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;overflow:hidden;position:relative;
background-color:var(--panel);background-image:linear-gradient(45deg,#8883 25%,transparent 25%,transparent 75%,#8883 75%),linear-gradient(45deg,#8883 25%,transparent 25%,transparent 75%,#8883 75%);background-size:20px 20px;background-position:0 0,10px 10px}
#stage.over{outline:2px solid var(--acc);outline-offset:-4px}
canvas{max-width:100%;max-height:70vh;display:none}
#hint{color:var(--mute);text-align:center;padding:24px}
#hint b{color:var(--fg);font-weight:600}
aside{display:grid;gap:16px;align-content:start}
label{display:grid;gap:6px;font-size:13px;color:var(--mute)}
label .v{color:var(--fg);float:right}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=color]{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:3px}
.row{display:flex;gap:8px;align-items:center;font-size:14px}
.bg{display:flex;gap:6px}
.bg button{flex:1}
button{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button.main{background:var(--acc);color:var(--bg);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
small{color:var(--mute);font-size:12.5px}
</style>
</head>
<body>
<main>
<h1>White to transparent<span>Whiter pixels become clearer. Grays stay partly see-through. Pick any color for what's left.</span></h1>

<div id="stage"><div id="hint"><b>Drop a photo here</b><br>or click to choose one</div><canvas id="c"></canvas></div>
<input id="file" type="file" accept="image/*" hidden>

<aside>
<label>Color<input id="col" type="color" value="#7a4a1e"></label>
<label>Keep original color <span class="row"><input id="orig" type="checkbox"> use the photo's own tones instead</span></label>
<label>Black point <span class="v" id="bv">0</span><input id="bp" type="range" min="0" max="254" value="0"></label>
<label>White point <span class="v" id="wv">255</span><input id="wp" type="range" min="1" max="255" value="255"></label>
<label>Preview behind
<span class="bg"><button data-bg="check">Checker</button><button data-bg="#ffffff">White</button><button data-bg="#111111">Black</button></span></label>
<label class="row"><input id="inv" type="checkbox"> Invert (black becomes clear)</label>
<button class="main" id="dl" disabled>Download PNG</button>
<small>Runs in your browser. Nothing is uploaded. Lower the white point if a light gray backdrop isn't going fully clear.</small>
</aside>
</main>
<script>
const $=id=>document.getElementById(id),c=$('c'),ctx=c.getContext('2d',{willReadFrequently:true}),stage=$('stage');
let src=null,name='image';
function load(f){if(!f||!f.type.startsWith('image/'))return;name=f.name.replace(/\.[^.]+$/,'');
const img=new Image();img.onload=()=>{c.width=img.naturalWidth;c.height=img.naturalHeight;ctx.drawImage(img,0,0);
src=ctx.getImageData(0,0,c.width,c.height);c.style.display='block';$('hint').style.display='none';$('dl').disabled=false;render()};
img.src=URL.createObjectURL(f)}
function render(){if(!src)return;
const b=+$('bp').value,w=Math.max(+$('wp').value,b+1),inv=$('inv').checked,orig=$('orig').checked;
$('bv').textContent=b;$('wv').textContent=w;
const h=$('col').value,R=parseInt(h.slice(1,3),16),G=parseInt(h.slice(3,5),16),B=parseInt(h.slice(5,7),16);
const out=ctx.createImageData(src.width,src.height),s=src.data,o=out.data;
for(let i=0;i<s.length;i+=4){
const l=.299*s[i]+.587*s[i+1]+.114*s[i+2];
let t=Math.min(1,Math.max(0,(l-b)/(w-b)));          // 0 = black, 1 = white
let a=inv?t:1-t;                                     // white -> clear
a*=s[i+3]/255;
if(orig){const k=a>0.004?1:0;                         // un-mix color from white backdrop
 const f=inv?0:1;
 for(let j=0;j<3;j++){const v=a>0.004?(f?(s[i+j]-255*(1-a))/a:s[i+j]):0;o[i+j]=Math.max(0,Math.min(255,v))}}
else{o[i]=R;o[i+1]=G;o[i+2]=B}
o[i+3]=Math.round(a*255)}
ctx.putImageData(out,0,0)}
['col','orig','bp','wp','inv'].forEach(id=>$(id).addEventListener('input',render));
document.querySelectorAll('[data-bg]').forEach(btn=>btn.onclick=()=>{
const v=btn.dataset.bg;stage.style.backgroundImage=v==='check'?'':'none';stage.style.backgroundColor=v==='check'?'':v;
if(v==='check'){stage.removeAttribute('style')}});
$('dl').onclick=()=>c.toBlob(bl=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name+'-transparent.png';a.click()},'image/png');
stage.onclick=()=>$('file').click();
$('file').onchange=e=>load(e.target.files[0]);
['dragenter','dragover'].forEach(ev=>stage.addEventListener(ev,e=>{e.preventDefault();stage.classList.add('over')}));
['dragleave','drop'].forEach(ev=>stage.addEventListener(ev,e=>{e.preventDefault();stage.classList.remove('over')}));
stage.addEventListener('drop',e=>load(e.dataTransfer.files[0]));
</script>
</body>
</html>
