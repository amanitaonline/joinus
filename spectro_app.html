<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spectrogram Viewer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* ── base vars (overridden by JS applyAccent) ── */
  :root, [data-theme="dark"] {
    --accent:        #7c3aed;
    --surface:       rgba(124,58,237,0.10);
    --surface-solid: rgba(124,58,237,0.18);
    --border:        rgba(124,58,237,0.35);
    --border-hi:     #7c3aed;
    --text:          rgba(200,180,255,0.80);
    --text-dim:      rgba(180,150,255,0.42);
    --text-hi:       #e0d0ff;
    --purple:        #7c3aed;
    --shadow:        0 20px 60px rgba(124,58,237,0.22), 0 4px 16px rgba(80,30,180,0.18);
    --shadow-sm:     0 2px 16px rgba(124,58,237,0.14);
    --modal-bg:      rgba(0,0,0,0.80);
    --card-bg:       rgba(124,58,237,0.08);
    --drop-bg:       #12102a;
    --separator:     rgba(124,58,237,0.14);
    --font-mono:     'SFMono-Regular', 'Consolas', 'Liberation Mono', monospace;
    --radius-md:     8px;
    --radius-lg:     12px;
  }

  html, body {
    min-height: 100vh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    transition: background 0.25s, color 0.25s;
    -webkit-font-smoothing: antialiased;
  }

  #app {
    max-width: 860px;
    margin: 0 auto;
    padding: 48px 24px 100px;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2rem;
  }

  header h1 {
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-hi);
  }

  header h1 i { margin-right: 6px; opacity: 0.7; }

  .theme-toggle {
    background: var(--surface-solid);
    border: 1.5px solid var(--border);
    border-radius: 980px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.7rem;
    font-weight: 500;
    padding: 5px 14px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: border-color 0.15s, color 0.15s, background 0.15s;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }
  .theme-toggle:hover { border-color: var(--border-hi); color: var(--text-hi); }

  /* ── DROP ZONE ── */
  #drop-zone {
    border: 1.5px dashed var(--border-hi);
    border-radius: 22px;
    padding: 4rem 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    background: var(--surface);
    position: relative;
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
  }
  #drop-zone.drag-over { background: var(--surface-solid); }
  #drop-zone input[type=file] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }
  .drop-icon { font-size: 40px; color: var(--text-dim); margin-bottom: 14px; }
  .drop-title { font-size: 15px; font-weight: 500; margin-bottom: 8px; color: var(--text-hi); }
  .drop-sub { font-size: 11px; color: var(--text-dim); letter-spacing: 0.06em; }

  /* ── VIEWER ── */
  #viewer { display: none; }
  #viewer.active { display: block; }

  #filename-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 1.25rem;
  }
  #fname {
    font-size: 13px; color: var(--text-dim); letter-spacing: 0.05em;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%;
    font-family: var(--font-mono);
  }
  #reset-btn {
    font-size: 11px; font-family: inherit; color: var(--text);
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 980px; padding: 5px 14px; cursor: pointer;
    transition: background 0.15s, border-color 0.15s; letter-spacing: 0.02em;
    backdrop-filter: blur(12px);
  }
  #reset-btn:hover { background: var(--surface-solid); border-color: var(--border-hi); }

  /* ── CANVAS WRAPS ── */
  #waveform-wrap {
    border-radius: var(--radius-md);
    overflow: hidden;
    margin-bottom: 6px;
    height: 80px;
    border: 1.5px solid var(--border);
  }
  #waveform-canvas { width: 100%; height: 80px; display: block; }

  #spec-wrap {
    border-radius: var(--radius-md);
    margin-bottom: 6px;
    overflow-x: auto;
    overflow-y: hidden;
    cursor: grab;
    user-select: none;
    -webkit-overflow-scrolling: touch;
    border: 1.5px solid var(--border);
  }
  #spec-wrap:active { cursor: grabbing; }
  #spec-inner {
    position: relative;
    display: inline-block;
    height: 100%;
    min-width: 100%;
  }
  #spec-canvas { display: block; image-rendering: pixelated; }

  #playhead {
    position: absolute; top: 0; left: 0; width: 2px; height: 100%;
    background: var(--border-hi); pointer-events: none; display: none; opacity: 0.85;
  }

  #freq-labels {
    display: flex; flex-direction: column-reverse; position: absolute;
    top: 4px; right: 6px; height: calc(100% - 8px);
    justify-content: space-between; pointer-events: none;
  }
  .freq-lbl {
    font-size: 9px; color: rgba(255,255,255,0.35); line-height: 1;
    letter-spacing: 0.03em; font-family: var(--font-mono);
  }

  /* ── LEGEND ── */
  #legend-bar {
    height: 6px; border-radius: 3px; margin-bottom: 4px;
  }
  #legend-labels {
    display: flex; justify-content: space-between;
    font-size: 9px; color: var(--text-dim); letter-spacing: 0.04em;
    margin-bottom: 1.25rem;
  }

  /* ── CONTROLS ROW ── */
  #colormap-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 1rem; flex-wrap: wrap;
  }
  #colormap-row label, #zoom-row label {
    font-size: 11px; color: var(--text-dim); letter-spacing: 0.05em;
  }
  #colormap-row select, #window-select {
    font-size: 11px; font-family: var(--font-mono);
    background: var(--drop-bg);
    color: var(--text-hi);
    border: 1.5px solid var(--border);
    border-radius: 8px; padding: 5px 10px; cursor: pointer;
    outline: none;
  }

  #controls {
    display: flex; align-items: center; gap: 12px; margin-bottom: 1rem;
  }
  #play-btn {
    width: 36px; height: 36px; border-radius: 50%;
    border: 1.5px solid var(--border);
    background: var(--surface);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 16px; color: var(--text-hi);
    transition: background 0.15s, border-color 0.15s; flex-shrink: 0;
    outline: none;
  }
  #play-btn:hover { background: var(--surface-solid); border-color: var(--border-hi); }

  #time-display {
    font-size: 12px; color: var(--text-dim);
    min-width: 100px; letter-spacing: 0.04em; flex-shrink: 0;
    font-family: var(--font-mono);
  }

  input[type=range] {
    flex: 1; accent-color: var(--border-hi); cursor: pointer; height: 4px;
  }

  #meta-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 0.5rem; }
  .meta-chip {
    font-size: 11px; color: var(--text-dim); letter-spacing: 0.05em;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 980px; padding: 4px 12px;
    font-family: var(--font-mono);
  }
  .meta-chip span { color: var(--text-hi); font-weight: 500; }

  #zoom-row {
    display: flex; align-items: center; gap: 10px; margin-bottom: 0.75rem; flex-wrap: wrap;
  }
  #zoom-slider { flex: 1; max-width: 160px; accent-color: var(--border-hi); height: 4px; cursor: pointer; }
  #zoom-reset {
    font-size: 10px; font-family: inherit; color: var(--text);
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 980px; padding: 3px 12px; cursor: pointer; letter-spacing: 0.02em;
    transition: background 0.15s, border-color 0.15s;
  }
  #zoom-reset:hover { background: var(--surface-solid); border-color: var(--border-hi); }
  #zoom-label { font-size: 11px; color: var(--text-dim); min-width: 36px; font-family: var(--font-mono); }

  #dl-row { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
  .dl-btn {
    font-size: 11px; font-family: inherit;
    background: var(--surface);
    color: var(--text-hi);
    border: 1.5px solid var(--border);
    border-radius: 980px; padding: 6px 16px; cursor: pointer;
    letter-spacing: 0.02em; transition: background 0.15s, border-color 0.15s;
  }
  .dl-btn:hover { background: var(--surface-solid); border-color: var(--border-hi); }
  .dl-btn.accent { border-color: var(--border-hi); }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><i class="ti ti-waveform" aria-hidden="true"></i> spectrogram viewer</h1>
    <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">[ light ]</button>
  </header>

  <h2 class="sr-only">Drop an audio file to view its spectrogram and frequency content over time.</h2>

  <div id="drop-zone">
    <input type="file" id="file-input" accept=".mp3,.wav,.flac,.aif,.aiff,.ogg" aria-label="Select audio file">
    <div class="drop-icon"><i class="ti ti-music" aria-hidden="true"></i></div>
    <div class="drop-title">drop an audio file here</div>
    <div class="drop-sub">mp3 &middot; wav &middot; flac &middot; aif &middot; ogg</div>
  </div>

  <div id="viewer">
    <div id="filename-bar">
      <div id="fname"></div>
      <button id="reset-btn"><i class="ti ti-x" aria-hidden="true" style="font-size:11px;margin-right:4px;"></i>new file</button>
    </div>

    <div id="colormap-row">
      <label for="colormap-select">colormap</label>
      <select id="colormap-select">
        <option value="magma">magma</option>
        <option value="viridis">viridis</option>
        <option value="inferno">inferno</option>
        <option value="thermal">thermal</option>
        <option value="plasma">plasma</option>
        <option value="neon">neon</option>
        <option value="ocean">ocean</option>
        <option value="ember">ember</option>
        <option value="arctic">arctic</option>
        <option value="acid">acid</option>
        <option value="rose">rose</option>
        <option value="gray">gray</option>
        <option value="invert">invert</option>
      </select>
      <label for="window-select" style="margin-left:6px;">window</label>
      <select id="window-select">
        <option value="hann">hann</option>
        <option value="hamming">hamming</option>
        <option value="blackman">blackman</option>
        <option value="rect">rectangular</option>
      </select>
    </div>

    <div id="zoom-row">
      <label for="zoom-slider">zoom</label>
      <input type="range" id="zoom-slider" min="1" max="10" step="0.1" value="1">
      <span id="zoom-label">1×</span>
      <button id="zoom-reset">reset</button>
    </div>

    <div id="waveform-wrap">
      <canvas id="waveform-canvas"></canvas>
    </div>

    <div id="spec-wrap">
      <div id="spec-inner">
        <canvas id="spec-canvas"></canvas>
        <div id="playhead"></div>
        <div id="freq-labels">
          <span class="freq-lbl" id="fl0"></span>
          <span class="freq-lbl" id="fl1"></span>
          <span class="freq-lbl" id="fl2"></span>
          <span class="freq-lbl" id="fl3"></span>
          <span class="freq-lbl" id="fl4"></span>
        </div>
      </div>
    </div>

    <div id="legend-bar"></div>
    <div id="legend-labels"><span>quiet</span><span>loud</span></div>

    <div id="dl-row">
      <button class="dl-btn accent" id="dl-spec-btn">↓ spectrogram PNG</button>
      <button class="dl-btn" id="dl-wave-btn">↓ waveform PNG</button>
    </div>

    <div id="controls">
      <button id="play-btn" aria-label="Play">
        <i class="ti ti-player-play" id="play-icon" aria-hidden="true"></i>
      </button>
      <span id="time-display">0:00 / 0:00</span>
      <input type="range" id="seek-slider" min="0" max="1000" value="0" step="1" aria-label="Seek">
    </div>

    <div id="meta-row"></div>
  </div>
</div>

<script>
// ── THEME SYSTEM (matches AOS Cover Ripper) ─────────────────────────────────
const ACCENTS = [
  { hex: '#7c3aed', rgb: '124,58,237'  },
  { hex: '#db2777', rgb: '219,39,119'  },
  { hex: '#0891b2', rgb: '8,145,178'   },
  { hex: '#16a34a', rgb: '22,163,74'   },
  { hex: '#ea580c', rgb: '234,88,12'   },
  { hex: '#dc2626', rgb: '220,38,38'   },
  { hex: '#2563eb', rgb: '37,99,235'   },
  { hex: '#9333ea', rgb: '147,51,234'  },
  { hex: '#0d9488', rgb: '13,148,136'  },
  { hex: '#ca8a04', rgb: '202,138,4'   },
  { hex: '#be185d', rgb: '190,24,93'   },
  { hex: '#4f46e5', rgb: '79,70,229'   },
];

function luminance(hex) {
  const r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  const toL=c=>c<=0.03928?c/12.92:Math.pow((c+0.055)/1.055,2.4);
  return 0.2126*toL(r)+0.7152*toL(g)+0.0722*toL(b);
}
function darken(hex,amt){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.max(0,Math.round(r*(1-amt)));g=Math.max(0,Math.round(g*(1-amt)));b=Math.max(0,Math.round(b*(1-amt)));
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}
function lighten(hex,amt){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.min(255,Math.round(r+(255-r)*amt));g=Math.min(255,Math.round(g+(255-g)*amt));b=Math.min(255,Math.round(b+(255-b)*amt));
  return{hex:`#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`,rgb:`${r},${g},${b}`};
}

let currentAccent = null;
let isDarkMode = true;

function applyAccent(a, dark) {
  currentAccent = a;
  const root = document.documentElement;
  const lum = luminance(a.hex);
  const isPastel = lum > 0.40;

  if (dark) {
    const darkBg    = darken(a.hex, isPastel ? 0.84 : 0.74);
    const borderCol = darken(a.hex, isPastel ? 0.60 : 0.48);
    const borderHi  = darken(a.hex, isPastel ? 0.42 : 0.28);
    const accentHex = isPastel ? darken(a.hex, 0.18) : a.hex;
    const ar=parseInt(accentHex.slice(1,3),16), ag=parseInt(accentHex.slice(3,5),16), ab=parseInt(accentHex.slice(5,7),16);
    const accentRgb=`${ar},${ag},${ab}`;
    const ddr=Math.min(255,parseInt(darkBg.slice(1,3),16)+22);
    const ddg=Math.min(255,parseInt(darkBg.slice(3,5),16)+22);
    const ddb=Math.min(255,parseInt(darkBg.slice(5,7),16)+22);

    root.style.setProperty('--accent',        accentHex);
    root.style.setProperty('--purple',        accentHex);
    root.style.setProperty('--surface',       `rgba(${accentRgb},0.10)`);
    root.style.setProperty('--surface-solid', `rgba(${accentRgb},0.18)`);
    root.style.setProperty('--card-bg',       `rgba(${accentRgb},0.08)`);
    root.style.setProperty('--drop-bg',       `rgb(${ddr},${ddg},${ddb})`);
    root.style.setProperty('--modal-bg',      'rgba(0,0,0,0.80)');
    root.style.setProperty('--separator',     `rgba(${accentRgb},0.14)`);
    root.style.setProperty('--text',          `rgba(${accentRgb},0.80)`);
    root.style.setProperty('--text-dim',      `rgba(${accentRgb},0.40)`);
    root.style.setProperty('--text-hi',       accentHex);
    root.style.setProperty('--border',        borderCol);
    root.style.setProperty('--border-hi',     borderHi);
    document.body.style.background = darkBg;
  } else {
    const pastel     = isPastel ? a : lighten(a.hex, 0.72);
    const pastelDeep = isPastel ? lighten(a.hex, 0.10) : lighten(a.hex, 0.48);
    const ink='45,30,60', inkHex='#2d1e3c';
    root.style.setProperty('--accent',        pastel.hex);
    root.style.setProperty('--purple',        pastelDeep.hex);
    root.style.setProperty('--surface',       `rgba(${pastel.rgb},0.55)`);
    root.style.setProperty('--surface-solid', `rgba(${pastel.rgb},0.82)`);
    root.style.setProperty('--card-bg',       `rgba(${pastel.rgb},0.45)`);
    root.style.setProperty('--drop-bg',       `rgb(${pastel.rgb})`);
    root.style.setProperty('--modal-bg',      `rgba(${pastel.rgb},0.94)`);
    root.style.setProperty('--separator',     `rgba(${ink},0.07)`);
    root.style.setProperty('--text',          `rgba(${ink},0.68)`);
    root.style.setProperty('--text-dim',      `rgba(${ink},0.35)`);
    root.style.setProperty('--text-hi',       inkHex);
    root.style.setProperty('--border',        pastelDeep.hex);
    root.style.setProperty('--border-hi',     darken(pastelDeep.hex, 0.12));
    document.body.style.background = `rgb(${pastel.rgb})`;
  }
}

function toggleTheme() {
  isDarkMode = !isDarkMode;
  document.documentElement.setAttribute('data-theme', isDarkMode ? 'dark' : 'light');
  document.getElementById('theme-btn').textContent = isDarkMode ? '[ light ]' : '[ dark ]';
  applyAccent(currentAccent, isDarkMode);
  // Redraw waveform so accent line color updates
  setTimeout(() => {
    if (window._spectroAudioBuffer) drawWaveform(window._spectroAudioBuffer);
  }, 30);
}

// randomise accent on load, start dark
applyAccent(ACCENTS[Math.floor(Math.random()*ACCENTS.length)], true);

(function () {
  const COLORMAPS = {
    magma:   [[0,0,0],[80,18,123],[182,54,121],[251,136,97],[252,253,191]],
    viridis: [[68,1,84],[59,82,139],[33,145,140],[94,201,98],[253,231,37]],
    inferno: [[0,0,4],[87,16,110],[188,55,84],[249,142,9],[252,255,164]],
    thermal: [[0,0,128],[0,128,255],[0,255,128],[255,255,0],[255,0,0]],
    plasma:  [[13,8,135],[126,3,168],[204,71,120],[248,149,64],[240,249,33]],
    neon:    [[0,0,0],[0,0,80],[0,180,255],[0,255,160],[255,255,0],[255,0,200]],
    ocean:   [[0,0,20],[0,30,80],[0,100,160],[0,200,200],[180,255,255]],
    ember:   [[10,0,0],[80,10,0],[200,60,0],[255,180,0],[255,255,200]],
    arctic:  [[5,5,30],[20,60,120],[40,140,200],[120,210,230],[220,245,255]],
    acid:    [[0,0,0],[30,80,0],[80,200,0],[200,255,0],[255,255,255]],
    rose:    [[10,0,10],[100,0,60],[220,30,100],[255,130,160],[255,230,230]],
    gray:    [[0,0,0],[64,64,64],[128,128,128],[192,192,192],[255,255,255]],
    invert:  [[255,255,255],[192,192,192],[128,128,128],[64,64,64],[0,0,0]],
  };

  function lerpColor(map, t) {
    const n = map.length - 1;
    const i = Math.min(Math.floor(t * n), n - 1);
    const f = t * n - i;
    const a = map[i], b = map[i + 1];
    return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
  }

  function applyWindow(buf, type) {
    const N = buf.length;
    for (let i = 0; i < N; i++) {
      let w = 1;
      if (type === 'hann')    w = 0.5 * (1 - Math.cos(2*Math.PI*i/(N-1)));
      else if (type === 'hamming') w = 0.54 - 0.46*Math.cos(2*Math.PI*i/(N-1));
      else if (type === 'blackman') w = 0.42 - 0.5*Math.cos(2*Math.PI*i/(N-1)) + 0.08*Math.cos(4*Math.PI*i/(N-1));
      buf[i] *= w;
    }
    return buf;
  }

  function fft(re, im) {
    const N = re.length;
    if (N <= 1) return;
    const half = N >> 1;
    const re_e = new Float32Array(half), im_e = new Float32Array(half);
    const re_o = new Float32Array(half), im_o = new Float32Array(half);
    for (let i = 0; i < half; i++) {
      re_e[i] = re[2*i]; im_e[i] = im[2*i];
      re_o[i] = re[2*i+1]; im_o[i] = im[2*i+1];
    }
    fft(re_e, im_e); fft(re_o, im_o);
    for (let k = 0; k < half; k++) {
      const angle = -2*Math.PI*k/N;
      const c = Math.cos(angle), s = Math.sin(angle);
      const tr = c*re_o[k] - s*im_o[k];
      const ti = s*re_o[k] + c*im_o[k];
      re[k] = re_e[k]+tr; im[k] = im_e[k]+ti;
      re[k+half] = re_e[k]-tr; im[k+half] = im_e[k]-ti;
    }
  }

  const dropZone   = document.getElementById('drop-zone');
  const fileInput  = document.getElementById('file-input');
  const viewer     = document.getElementById('viewer');
  const waveCanvas = document.getElementById('waveform-canvas');
  const specCanvas = document.getElementById('spec-canvas');
  const waveCtx    = waveCanvas.getContext('2d');
  const specCtx    = specCanvas.getContext('2d');
  const playBtn    = document.getElementById('play-btn');
  const playIcon   = document.getElementById('play-icon');
  const seekSlider = document.getElementById('seek-slider');
  const timeDisplay= document.getElementById('time-display');
  const playhead   = document.getElementById('playhead');
  const metaRow    = document.getElementById('meta-row');
  const colormapSel= document.getElementById('colormap-select');
  const windowSel  = document.getElementById('window-select');
  const resetBtn   = document.getElementById('reset-btn');
  const zoomSlider = document.getElementById('zoom-slider');
  const zoomLabel  = document.getElementById('zoom-label');
  const zoomReset  = document.getElementById('zoom-reset');
  const specWrap   = document.getElementById('spec-wrap');
  const specInner  = document.getElementById('spec-inner');
  const dlSpecBtn  = document.getElementById('dl-spec-btn');
  const dlWaveBtn  = document.getElementById('dl-wave-btn');

  let audioCtx = null, audioBuffer = null, source = null;
  let isPlaying = false, startTime = 0, pauseOffset = 0;
  let animFrame = null, spectrogramData = null;
  let currentZoom = 1;
  let currentFileName = 'spectrogram';

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
  fileInput.addEventListener('change', () => { if (fileInput.files[0]) handleFile(fileInput.files[0]); });
  resetBtn.addEventListener('click', resetViewer);
  playBtn.addEventListener('click', togglePlay);
  seekSlider.addEventListener('input', onSeek);
  colormapSel.addEventListener('change', () => { if (spectrogramData) drawSpectrogram(spectrogramData, colormapSel.value); });
  windowSel.addEventListener('change', () => { if (audioBuffer) computeAndDraw(); });

  // ── zoom ───────────────────────────────────────────────────────────────────
  function applyZoom(z) {
    currentZoom = z;
    zoomLabel.textContent = z.toFixed(1) + '×';
    zoomSlider.value = z;
    if (spectrogramData) {
      const baseW = specWrap.clientWidth;
      specInner.style.width = Math.round(baseW * z) + 'px';
      specCanvas.style.width = Math.round(baseW * z) + 'px';
    }
  }

  zoomSlider.addEventListener('input', () => applyZoom(parseFloat(zoomSlider.value)));
  zoomReset.addEventListener('click', () => applyZoom(1));

  // Pinch-to-zoom on touch
  let lastPinchDist = null;
  specWrap.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      lastPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    }
  }, { passive: true });
  specWrap.addEventListener('touchmove', e => {
    if (e.touches.length === 2 && lastPinchDist) {
      const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      const newZ = Math.min(10, Math.max(1, currentZoom * (dist / lastPinchDist)));
      applyZoom(newZ);
      lastPinchDist = dist;
    }
  }, { passive: true });
  specWrap.addEventListener('touchend', () => { lastPinchDist = null; });

  // Ctrl+Scroll or trackpad pinch zoom
  specWrap.addEventListener('wheel', e => {
    if (e.ctrlKey || e.metaKey) {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      applyZoom(Math.min(10, Math.max(1, currentZoom * delta)));
    }
  }, { passive: false });

  // Drag to scroll inside spec-wrap
  let isDragging = false, dragStartX = 0, scrollStartX = 0;
  specWrap.addEventListener('mousedown', e => { isDragging = true; dragStartX = e.clientX; scrollStartX = specWrap.scrollLeft; specWrap.style.cursor = 'grabbing'; });
  window.addEventListener('mouseup', () => { isDragging = false; specWrap.style.cursor = ''; });
  window.addEventListener('mousemove', e => { if (isDragging) specWrap.scrollLeft = scrollStartX - (e.clientX - dragStartX); });

  // ── download ───────────────────────────────────────────────────────────────
  function downloadCanvas(canvas, name) {
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = name;
    a.click();
  }
  dlSpecBtn.addEventListener('click', () => downloadCanvas(specCanvas, currentFileName + '_spectrogram.png'));
  dlWaveBtn.addEventListener('click', () => downloadCanvas(waveCanvas, currentFileName + '_waveform.png'));

  function resetViewer() {
    if (source) { try { source.stop(); } catch(e){} source = null; }
    cancelAnimationFrame(animFrame);
    isPlaying = false; pauseOffset = 0;
    audioBuffer = null; spectrogramData = null; window._spectroAudioBuffer = null;
    viewer.classList.remove('active');
    dropZone.style.display = '';
    fileInput.value = '';
    applyZoom(1);
  }

  async function handleFile(file) {
    dropZone.style.display = 'none';
    viewer.classList.add('active');
    currentFileName = file.name.replace(/\.[^.]+$/, '');
    document.getElementById('fname').textContent = file.name;

    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    const arrBuf = await file.arrayBuffer();
    audioBuffer = await audioCtx.decodeAudioData(arrBuf);
    window._spectroAudioBuffer = audioBuffer;

    renderMeta(file, audioBuffer);
    drawWaveform(audioBuffer);
    computeAndDraw();

    seekSlider.max = Math.round(audioBuffer.duration * 1000);
    seekSlider.value = 0;
    pauseOffset = 0;
    timeDisplay.textContent = `0:00 / ${fmt(audioBuffer.duration)}`;
  }

  function renderMeta(file, buf) {
    const ext = file.name.split('.').pop().toUpperCase();
    const sizeKB = (file.size / 1024).toFixed(0);
    metaRow.innerHTML = [
      `<div class="meta-chip">format <span>${ext}</span></div>`,
      `<div class="meta-chip">duration <span>${fmt(buf.duration)}</span></div>`,
      `<div class="meta-chip">sample rate <span>${(buf.sampleRate/1000).toFixed(1)} kHz</span></div>`,
      `<div class="meta-chip">channels <span>${buf.numberOfChannels === 1 ? 'mono' : buf.numberOfChannels === 2 ? 'stereo' : buf.numberOfChannels}</span></div>`,
      `<div class="meta-chip">size <span>${sizeKB} KB</span></div>`,
    ].join('');
  }

  function drawWaveform(buf) {
    const W = waveCanvas.parentElement.clientWidth;
    const H = 80;
    const dpr = devicePixelRatio || 1;
    waveCanvas.width = W * dpr;
    waveCanvas.height = H * dpr;
    waveCanvas.style.width = W + 'px';
    waveCanvas.style.height = H + 'px';
    waveCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    waveCtx.clearRect(0, 0, W, H);

    const data = buf.getChannelData(0);
    const step = Math.ceil(data.length / W);
    const mid = H / 2;

    const accentColor = getComputedStyle(document.documentElement).getPropertyValue('--border-hi').trim() || '#1e8a6b';
    waveCtx.strokeStyle = accentColor;
    waveCtx.lineWidth = 1;
    waveCtx.beginPath();
    for (let x = 0; x < W; x++) {
      let min = 0, max = 0;
      for (let j = 0; j < step; j++) {
        const v = data[x * step + j] || 0;
        if (v < min) min = v;
        if (v > max) max = v;
      }
      waveCtx.moveTo(x, mid + min * mid);
      waveCtx.lineTo(x, mid + max * mid);
    }
    waveCtx.stroke();

    waveCtx.strokeStyle = accentColor.replace(')', ',0.22)').replace('rgb(', 'rgba(');
    waveCtx.lineWidth = 0.5;
    waveCtx.beginPath();
    waveCtx.moveTo(0, mid); waveCtx.lineTo(W, mid);
    waveCtx.stroke();
  }

  function computeAndDraw() {
    if (!audioBuffer) return;
    const FFT_SIZE = 2048, HOP = 512;
    const data = audioBuffer.getChannelData(0);
    const sampleRate = audioBuffer.sampleRate;
    const numFrames = Math.floor((data.length - FFT_SIZE) / HOP);
    const numBins = FFT_SIZE / 2;
    const windowType = windowSel.value;
    const magMatrix = [];

    for (let f = 0; f < numFrames; f++) {
      const offset = f * HOP;
      const re = new Float32Array(FFT_SIZE);
      const im = new Float32Array(FFT_SIZE);
      for (let i = 0; i < FFT_SIZE; i++) re[i] = data[offset + i] || 0;
      applyWindow(re, windowType);
      fft(re, im);
      const mags = new Float32Array(numBins);
      for (let k = 0; k < numBins; k++) {
        mags[k] = 20 * Math.log10(Math.sqrt(re[k]*re[k]+im[k]*im[k]) + 1e-8);
      }
      magMatrix.push(mags);
    }

    spectrogramData = { magMatrix, numFrames, numBins, sampleRate, FFT_SIZE };
    drawSpectrogram(spectrogramData, colormapSel.value);
    updateFreqLabels(sampleRate, FFT_SIZE);
  }

  function drawSpectrogram({ magMatrix, numFrames, numBins, sampleRate, FFT_SIZE }, colormap) {
    const W = specWrap.clientWidth;
    const H = Math.min(320, Math.round(W * 0.45));
    specCanvas.width = numFrames;
    specCanvas.height = numBins;
    const zoomedW = Math.round(W * currentZoom);
    specCanvas.style.width = zoomedW + 'px';
    specCanvas.style.height = H + 'px';
    specInner.style.width = zoomedW + 'px';
    specInner.style.height = H + 'px';
    specWrap.style.height = H + 'px';
    playhead.style.height = H + 'px';

    const img = specCtx.createImageData(numFrames, numBins);
    const map = COLORMAPS[colormap];
    let globalMin = Infinity, globalMax = -Infinity;
    for (let f = 0; f < numFrames; f++) {
      for (let k = 0; k < numBins; k++) {
        const v = magMatrix[f][k];
        if (v < globalMin) globalMin = v;
        if (v > globalMax) globalMax = v;
      }
    }
    const range = globalMax - globalMin || 1;

    for (let f = 0; f < numFrames; f++) {
      for (let k = 0; k < numBins; k++) {
        const t = (magMatrix[f][k] - globalMin) / range;
        const [r,g,b] = lerpColor(map, Math.max(0, Math.min(1, t)));
        const y = numBins - 1 - k;
        const idx = (y * numFrames + f) * 4;
        img.data[idx] = r; img.data[idx+1] = g; img.data[idx+2] = b; img.data[idx+3] = 255;
      }
    }
    specCtx.putImageData(img, 0, 0);

    // Update legend gradient from the colormap
    const stops = map.map((c,i) => `rgb(${c[0]},${c[1]},${c[2]}) ${(i/(map.length-1)*100).toFixed(0)}%`).join(', ');
    document.getElementById('legend-bar').style.background = `linear-gradient(to right, ${stops})`;
  }

  function updateFreqLabels(sampleRate, FFT_SIZE) {
    const nyq = sampleRate / 2;
    [0, 0.25, 0.5, 0.75, 1.0].forEach((frac, i) => {
      const f = frac * nyq;
      document.getElementById('fl' + i).textContent =
        f >= 1000 ? (f / 1000).toFixed(1) + 'k' : Math.round(f) + 'Hz';
    });
  }

  function fmt(secs) {
    const m = Math.floor(secs / 60);
    const s = Math.floor(secs % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function togglePlay() {
    if (!audioBuffer) return;
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (isPlaying) {
      pauseOffset += audioCtx.currentTime - startTime;
      source.stop(); source = null;
      isPlaying = false;
      playIcon.className = 'ti ti-player-play';
      cancelAnimationFrame(animFrame);
    } else {
      source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);
      source.start(0, pauseOffset);
      startTime = audioCtx.currentTime;
      isPlaying = true;
      playIcon.className = 'ti ti-player-pause';
      source.onended = () => {
        if (isPlaying) {
          isPlaying = false; pauseOffset = 0;
          playIcon.className = 'ti ti-player-play';
          seekSlider.value = 0; playhead.style.display = 'none';
          cancelAnimationFrame(animFrame);
          timeDisplay.textContent = `0:00 / ${fmt(audioBuffer.duration)}`;
        }
      };
      tick();
    }
  }

  function tick() {
    if (!isPlaying) return;
    const elapsed = pauseOffset + (audioCtx.currentTime - startTime);
    const duration = audioBuffer.duration;
    const progress = Math.min(elapsed / duration, 1);
    seekSlider.value = Math.round(progress * 1000);
    timeDisplay.textContent = `${fmt(elapsed)} / ${fmt(duration)}`;
    playhead.style.display = 'block';
    playhead.style.left = (progress * specInner.clientWidth) + 'px';
    animFrame = requestAnimationFrame(tick);
  }

  function onSeek() {
    if (!audioBuffer) return;
    const t = (seekSlider.value / 1000) * audioBuffer.duration;
    pauseOffset = t;
    if (isPlaying) {
      source.stop();
      source = audioCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(audioCtx.destination);
      source.start(0, t);
      startTime = audioCtx.currentTime;
      source.onended = () => {
        if (isPlaying) {
          isPlaying = false; pauseOffset = 0;
          playIcon.className = 'ti ti-player-play';
          seekSlider.value = 0; playhead.style.display = 'none';
          cancelAnimationFrame(animFrame);
        }
      };
    }
    timeDisplay.textContent = `${fmt(t)} / ${fmt(audioBuffer.duration)}`;
    playhead.style.left = (t / audioBuffer.duration * specInner.clientWidth) + 'px';
  }

})();
</script>
</body>
</html>
